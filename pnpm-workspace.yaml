blockExoticSubdeps: true
cleanupUnusedCatalogs: true
lockfileIncludeTarballUrl: true
minimumReleaseAge: '4320'
minimumReleaseAgeExclude:
  - '@cdxgen/*'
  - '@appthreat/*'
  - 'typescript'
  - '@typescript/*'
  # the packageManager self-reference is not a real dependency; the latest
  # pnpm must be usable as soon as the hash in package.json is refreshed
  - 'pnpm'
  - '@pnpm/*'
optimisticRepeatInstall: true
preferSymlinkedExecutables: false
strictDepBuilds: true
trustPolicy: no-downgrade

# pnpm 11 and later no longer read the `pnpm` field in package.json;
# overrides and built-dependency policy live here instead.
onlyBuiltDependencies:
  - '@biomejs/biome'
ignoredBuiltDependencies:
  - 'unrs-resolver'
overrides:
  iconv-lite: '0.7.2'
  yargs: '18.2.0'
  type-detect: '4.1.0'
  on-finished: '2.4.1'

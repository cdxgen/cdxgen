version = 1
revision = 3
requires-python = ">=3.10"

[[package]]
name = "brotli"
version = "1.2.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "brotlicffi"
version = "1.2.0.2"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "cffi" },
]

[[package]]
name = "certifi"
version = "2026.10.19"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "cffi"
version = "2.0.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "pycparser", marker = "implementation_name != 'PyPy'" },
]

[[package]]
name = "pycparser"
version = "2.23"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "requests"
version = "2.34.2"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "certifi" },
    { name = "urllib3" },
]

[[package]]
name = "urllib3"
version = "2.8.0"
source = { registry = "https://pypi.org/simple" }

[package.optional-dependencies]
brotli = [
    { name = "brotli", marker = "platform_python_implementation == 'CPython'" },
    { name = "brotlicffi", marker = "platform_python_implementation != 'CPython'" },
]

[[package]]
name = "uv-brotli-extras"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "requests" },
    { name = "urllib3", extra = ["brotli"] },
]

[package.metadata]
requires-dist = [
    { name = "requests", specifier = ">=2.32" },
    { name = "urllib3", extras = ["brotli"], specifier = ">=2.2" },
]

version = 1
requires-python = ">=3.12"

[[package]]
name = "demo"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "privpkg" },
    { name = "gitpkg" },
    { name = "localpkg" },
]

[[package]]
name = "privpkg"
version = "1.0.0"
source = { registry = "https://pypi.acme.invalid/simple" }

[[package]]
name = "gitpkg"
version = "2.0.0"
source = { git = "https://github.com/acme/gitpkg?rev=abc#0123456789abcdef0123456789abcdef01234567" }

[[package]]
name = "localpkg"
version = "0.3.0"
source = { editable = "libs/localpkg" }

[[package]]
name = "dirpkg"
version = "0.4.0"
source = { directory = "libs/dirpkg" }

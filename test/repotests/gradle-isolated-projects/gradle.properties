# Mirrors the issue #4444 environment (okhttp at 75d8f91c): a multi-project
# build that opts into Gradle's isolated-projects mode and the configuration
# cache from gradle.properties. The isolated-projects property is spelled
# org.gradle.unsafe.isolated-projects from Gradle 8.6 until 9.7 renamed it to
# org.gradle.isolated-projects, so both spellings are set to keep the fixture
# reproducible on any Gradle that supports the mode. Isolated projects also
# require the configuration cache, which okhttp enables anyway.
org.gradle.isolated-projects=true
org.gradle.unsafe.isolated-projects=true
org.gradle.configuration-cache=true

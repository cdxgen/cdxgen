name: Repo tests (quick)

# The quick tier of the repo tests, moved out of repotests.yml so it is no
# longer gated by that workflow's pull_request paths filter. These two jobs
# run on every pull request and merge-group build, and both are required
# status checks on master: auto-merge cannot complete before they have
# actually run. A change that touches only files no test reads takes the fast
# lane (see .github/scripts/docs-only.mjs): both jobs still start and report
# success, but skip their steps and say why in the job summary.
#
#   ci:skip-repotests - skips these jobs. A skipped required check counts as
#                       green, so this label is the emergency hatch for
#                       changes that cannot affect them (docs, CI-only
#                       edits). It skips the heavy suite in repotests.yml
#                       too; it takes effect from the next push.
on:
  pull_request:
  merge_group:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXUS_URL: ${{ secrets.NEXUS_URL }}

# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: {}

jobs:
  # Decides whether the change touches only files no test reads, see
  # .github/scripts/docs-only.mjs. The jobs that need it still run and still
  # report success; they skip their steps and say why in the job summary. If
  # this job fails, they run in full.
  lane:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
    outputs:
      docs-only: ${{ steps.lane.outputs.docs-only }}
      reason: ${{ steps.lane.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: lane
        run: node .github/scripts/docs-only.mjs
        env:
          EVENT_NAME: ${{ github.event_name }}

  cli-tests-quick-amd64:
    needs: [lane]
    runs-on: ["self-hosted", "ubuntu", "amd64"]
    timeout-minutes: 90
    if: ${{ !cancelled() && !contains(github.event.pull_request.labels.*.name, 'ci:skip-repotests') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: needs.lane.outputs.docs-only != 'true'
        with:
          go-version: '1.27.0'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: needs.lane.outputs.docs-only != 'true'
        with:
          persist-credentials: false
          repository: 'hoolicorp/java-sec-code'
          path: 'repotests/java-sec-code'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: needs.lane.outputs.docs-only != 'true'
        with:
          persist-credentials: false
          repository: 'rtfeldman/elm-spa-example'
          path: 'repotests/elm-spa-example'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: needs.lane.outputs.docs-only != 'true'
        with:
          persist-credentials: false
          repository: 'hashicorp-education/learn-terraform-modules-use'
          ref: '753518c20cdca94c67e1f0e2890e71f6a96af262'
          path: 'repotests/learn-terraform-modules-use'
      - name: Setup pnpm
        if: needs.lane.outputs.docs-only != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        if: needs.lane.outputs.docs-only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: pnpm install
        if: needs.lane.outputs.docs-only != 'true'
        run: |
          pnpm install:frozen
          mkdir -p bomresults
          rm -rf $CDXGEN_TEMP_DIR && mkdir -p $CDXGEN_TEMP_DIR
        env:
          CI: true
          CDXGEN_TEMP_DIR: ${{ runner.temp }}/cdxgen-repotests
      - name: repotests java-sec-code
        if: needs.lane.outputs.docs-only != 'true'
        run: |
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-1.json --include-formulation --include-crypto --fail-on-error
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-1.spdx.json --format spdx --fail-on-error
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-2.json --author foo --author bar --standard asvs-4.0.3
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-3.json --required-only --fail-on-error
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-4.json --filter postgres --filter json
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-5.json --only spring --fail-on-error
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-6.json --deep --evidence
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-7.json --profile research --spec-version 1.6 --export-proto --proto-bin-file bomresults/bom-java-sec-code-7.cdx
          node bin/convert.js -i bomresults/bom-java-sec-code-7.json -o bomresults/bom-java-sec-code-7.spdx.json
          node bin/convert.js -i bomresults/bom-java-sec-code-7.cdx -o bomresults/bom-java-sec-code-7.proto.spdx.json
          bin/validate.js -i bomresults/bom-java-sec-code-7.cdx --fail-severity critical --no-deep --report json > bomresults/bom-java-sec-code-7.validate.json
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-11.json --spec-version 1.7 --export-proto --proto-bin-file bomresults/bom-java-sec-code-11.cdx --fail-on-error
          node bin/convert.js -i bomresults/bom-java-sec-code-11.json -o bomresults/bom-java-sec-code-11.spdx.json
          node bin/convert.js -i bomresults/bom-java-sec-code-11.cdx -o bomresults/bom-java-sec-code-11.proto.spdx.json
          bin/validate.js -i bomresults/bom-java-sec-code-11.cdx --fail-severity critical --no-deep --report json > bomresults/bom-java-sec-code-11.validate.json
          ls -lh bomresults
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-8.json --profile license-compliance
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-9.json --include-regex "pom.xml" --bom-audit
          bin/cdxgen.js -t java -t github repotests/java-sec-code -o bomresults/bom-java-sec-code-9.json
          bin/cdxgen.js -t java -exclude-type js repotests/java-sec-code -o bomresults/bom-java-sec-code-10.json
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-release-notes.json --include-release-notes --release-notes-current-tag v1.0.0 --release-notes-previous-tag v0.9.0 --fail-on-error
          jq -e 'any(.metadata.tools.components[]; .group == "@cdxgen" and .name == "cdxgen" and (.releaseNotes.type != null) and (.releaseNotes.title != null) and (.releaseNotes.description != null) and (.releaseNotes.timestamp != null) and ((.releaseNotes.tags | length) >= 1) and (.releaseNotes.resolves | type == "array"))' bomresults/bom-java-sec-code-release-notes.json
          bin/cdxgen.js -t java https://github.com/HooliCorp/java-sec-code.git -o bomresults/bom-java-sec-code-git-url.json --git-branch master --fail-on-error --bom-audit
          bin/cdxgen.js -t js "pkg:npm/lodash@4.17.21" -o bomresults/bom-lodash-purl.json --fail-on-error
          bin/cdxgen.js -t java test/data/maven-optional-repotest -o bomresults/bom-maven-optional-fixture.json --fail-on-error
          jq -e 'any(.components[]; .purl == "pkg:maven/org.apache.maven/maven-artifact@3.9.9?type=jar" and .scope == "optional")' bomresults/bom-maven-optional-fixture.json
          jq -e 'any(.dependencies[]; .ref == "pkg:maven/example/maven-optional-repotest@1.0.0?type=jar" and (.dependsOn | index("pkg:maven/org.apache.maven/maven-artifact@3.9.9?type=jar")))' bomresults/bom-maven-optional-fixture.json
          bin/validate.js -i bomresults/bom-java-sec-code-10.json --format console --fail-severity critical
        shell: bash
        env:
          NPM_URL: ${{ env.NEXUS_URL }}
      - name: repotests java-sec-code (allow lists)
        if: needs.lane.outputs.docs-only != 'true'
        run: |
          CDXGEN_ALLOWED_COMMANDS=none CDXGEN_ALLOWED_HOSTS=localhost bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-1.json
          CDXGEN_ALLOWED_COMMANDS=mvn CDXGEN_ALLOWED_HOSTS="*.maven.org,*.github.com" bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-2.json --fail-on-error
        shell: bash
        env:
          FETCH_LICENSE: true
          CDXGEN_TRACE_ID: foo
          CDXGEN_DEBUG_MODE: debug
      - name: repotests cargo fixture
        if: needs.lane.outputs.docs-only != 'true'
        run: |
          bin/cdxgen.js -t cargo -t github test/data/cargo-workspace-repotest -o bomresults/bom-cargo-workspace-fixture.json --include-formulation --bom-audit
          jq -e 'any(.components[]; .name == "core" and any((.properties // [])[]; .name == "cdx:cargo:workspaceDependencyResolved" and .value == "true"))' bomresults/bom-cargo-workspace-fixture.json
          jq -e 'any(.components[]; .name == "build-helper" and any((.properties // [])[]; .name == "cdx:cargo:dependencyKind" and .value == "build") and any((.properties // [])[]; .name == "cdx:cargo:resolvedWorkspaceMember" and .value == "build-helper"))' bomresults/bom-cargo-workspace-fixture.json
          jq -e 'any(.components[]; any((.properties // [])[]; .name == "cdx:github:action:ecosystem" and .value == "cargo") and any((.properties // [])[]; .name == "cdx:github:action:role" and .value == "toolchain"))' bomresults/bom-cargo-workspace-fixture.json
          jq -e 'any(.components[]; any((.properties // [])[]; .name == "cdx:github:step:usesCargo" and .value == "true") and any((.properties // [])[]; .name == "cdx:github:step:cargoSubcommands" and .value == "build,test"))' bomresults/bom-cargo-workspace-fixture.json
          jq -e 'any(.annotations[]?; (.text // "") | contains("INT-012"))' bomresults/bom-cargo-workspace-fixture.json
          jq -e 'any(.annotations[]?; (.text // "") | contains("INT-013"))' bomresults/bom-cargo-workspace-fixture.json
          CARGO_CACHE_DIR=test/data/cargo-cache-fixture/registry/cache/index.crates.io-1949cf8c6b5b557f bin/cdxgen.js -t cargo-cache . -o bomresults/bom-cargo-cache-fixture.json --fail-on-error
          jq -e 'any(.components[]; .name == "serde" and any((.properties // [])[]; .name == "cdx:cargo:cacheSource" and .value == "registry-cache"))' bomresults/bom-cargo-cache-fixture.json
        shell: bash
      - name: repotests learn-terraform-modules-use
        if: needs.lane.outputs.docs-only != 'true'
        run: |
          bin/cdxgen.js -t terraform repotests/learn-terraform-modules-use -o bomresults/bom-learn-terraform-modules.json --fail-on-error
          jq -e 'any(.components[]; .name == "vpc/aws" and .version == "3.18.1" and any((.properties // [])[]; .name == "cdx:tf:kind" and .value == "module") and any((.properties // [])[]; .name == "cdx:tf:module:pinning" and .value == "exact"))' bomresults/bom-learn-terraform-modules.json
          jq -e 'any(.components[]; .name == "ec2-instance/aws" and .version == "4.3.0" and any((.properties // [])[]; .name == "cdx:tf:kind" and .value == "module") and any((.properties // [])[]; .name == "cdx:tf:module:pinning" and .value == "exact"))' bomresults/bom-learn-terraform-modules.json
          jq -e 'any(.components[]; .name == "aws" and .version == "4.49.0" and any((.properties // [])[]; .name == "cdx:tf:kind" and .value == "provider"))' bomresults/bom-learn-terraform-modules.json
          jq -e 'any(.metadata.component.properties[]?; .name == "cdx:tf:root" and .value == ".")' bomresults/bom-learn-terraform-modules.json
          PARENT_REF=$(jq -r '.metadata.component["bom-ref"]' bomresults/bom-learn-terraform-modules.json)
          jq -e --arg pref "$PARENT_REF" 'any(.dependencies[]; .ref == $pref and any(.dependsOn[]; startswith("pkg:generic/registry.terraform.io/terraform-aws-modules/vpc/aws@"))) and all(.components[]?; ((.purl // "") | startswith("pkg:terraform/") | not))' bomresults/bom-learn-terraform-modules.json
          bin/cdxgen.js repotests/learn-terraform-modules-use -o bomresults/bom-learn-terraform-modules-default.json --fail-on-error
          jq -e 'any(.components[]; .name == "vpc/aws" and .version == "3.18.1")' bomresults/bom-learn-terraform-modules-default.json
        shell: bash
      - name: repotests terraform fixtures
        if: needs.lane.outputs.docs-only != 'true'
        run: |
          for d in terraform-modules terraform-static terraform-monorepo terraform-tofu; do
            bin/cdxgen.js -t terraform test/data/$d -o bomresults/bom-$d.json --fail-on-error
          done
          jq -e 'any(.components[]; .name == "vpc/aws" and .version == "5.1.2" and any(.licenses[]?; .license.id == "Apache-2.0") and any((.properties // [])[]; .name == "cdx:tf:licenseSource" and .value == "file"))' bomresults/bom-terraform-modules.json
          jq -e 'any(.components[]; .name == "aws" and .version == "5.80.0" and any(.licenses[]?; .license.id == "MPL-2.0"))' bomresults/bom-terraform-modules.json
          jq -e 'any(.components[]; .name == "network" and .version == "main" and any((.properties // [])[]; .name == "cdx:tf:module:pinning" and .value == "branch"))' bomresults/bom-terraform-static.json
          jq -e 'any(.components[]; any((.properties // [])[]; .name == "cdx:tf:module:credentialInSource" and .value == "true"))' bomresults/bom-terraform-static.json
          jq -e 'any(.components[]; .type == "application" and .["bom-ref"] == "terraform-root:envs/dev")' bomresults/bom-terraform-monorepo.json
          jq -e 'any(.components[]; .name == "vpc/aws" and .version == "5.1.0" and (.purl | contains("registry.opentofu.org")))' bomresults/bom-terraform-tofu.json
          bin/cdxgen.js test/data/terraform-modules -o bomresults/bom-terraform-modules-default.json --fail-on-error
          jq -e 'any(.components[]; .name == "vpc/aws" and .version == "5.1.2") and all(.components[]; ((.purl // "") | contains("#.terraform/") | not))' bomresults/bom-terraform-modules-default.json
        shell: bash
      - name: repotests elm-spa-example
        if: needs.lane.outputs.docs-only != 'true'
        run: |
          bin/cdxgen.js -t elm repotests/elm-spa-example -o bomresults/bom-elm-spa-example.json --fail-on-error
          jq -e '(.components | length) >= 10' bomresults/bom-elm-spa-example.json
          jq -e 'any(.components[]; .name == "http" and .group == "elm" and (.purl | startswith("pkg:generic/elm/http@")) and any((.properties // [])[]; .name == "cdx:elm:dependency" and .value == "direct") and any((.properties // [])[]; .name == "cdx:purl:proposedType" and .value == "elm"))' bomresults/bom-elm-spa-example.json
          jq -e 'any(.metadata.component.properties[]?; .name == "cdx:elm:elmVersion")' bomresults/bom-elm-spa-example.json
          jq -e 'any(.components[]; .scope == "optional" and any((.properties // [])[]; .name == "cdx:elm:dependency" and (.value == "direct-test" or .value == "indirect-test")))' bomresults/bom-elm-spa-example.json
        shell: bash
      - name: repotests source crypto fixture
        if: needs.lane.outputs.docs-only != 'true'
        run: |
          bin/cdxgen.js test/data/cbom-js-repotest -o bomresults/bom-cbom-js-fixture.json --include-crypto --evidence --deep --spec-version 1.7 --fail-on-error
          bin/cdxgen.js test/data/cbom-js-repotest -o bomresults/bom-cbom-js-fixture.proto.json --include-crypto --evidence --deep --spec-version 1.7 --export-proto --proto-bin-file bomresults/bom-cbom-js-fixture.cdx --fail-on-error
          bin/cdxgen.js test/data/cbom-js-repotest -o bomresults/bom-cbom-js-fixture-libraries.json --include-crypto --evidence --deep --spec-version 1.7 --component-type library --fail-on-error
          bin/cdxgen.js -t js test/data/atom-exclude-repotest -o bomresults/bom-atom-exclude-fixture.json --profile research --exclude "**/ignored/**" --fail-on-error
          node bin/convert.js -i bomresults/bom-cbom-js-fixture.cdx -o bomresults/bom-cbom-js-fixture.proto.spdx.json
          bin/validate.js -i bomresults/bom-cbom-js-fixture.cdx --fail-severity critical --no-deep --report json > bomresults/bom-cbom-js-fixture.validate.json
          jq -e 'all(.components[]?; .type == "library")' bomresults/bom-cbom-js-fixture-libraries.json
          jq -e 'any(.components[]; .type == "cryptographic-asset" and .name == "sha-512" and .cryptoProperties.assetType == "algorithm" and .cryptoProperties.oid == "2.16.840.1.101.3.4.2.3")' bomresults/bom-cbom-js-fixture.json
          jq -e 'all(.components[]? | select(.type == "cryptographic-asset"); .purl == null)' bomresults/bom-cbom-js-fixture.proto.json
          jq -e 'any(.components[]; .type == "cryptographic-asset" and .name == "aes256-GCM" and any((.properties // [])[]; .name == "cdx:crypto:sourceType" and .value == "js-ast:webcrypto.generateKey"))' bomresults/bom-cbom-js-fixture.json
          jq -e 'any(.components[]; .type == "cryptographic-asset" and .name == "sha-384" and any((.properties // [])[]; .name == "cdx:crypto:sourceLocation" and .value == "dynamic-branches.mjs:12:0") and any((.evidence.occurrences // [])[]; .location == "dynamic-branches.mjs" and .line == 12 and .symbol == "node:crypto.createHash" and .additionalContext == "hash" and (.offset? == null)))' bomresults/bom-cbom-js-fixture.json
          jq -e 'any(.components[]; .type == "cryptographic-asset" and .name == "sha-384" and any((.properties // [])[]; .name == "cdx:crypto:sourceType" and .value == "js-ast:node:crypto.sign") and any((.evidence.occurrences // [])[]; .location == "dynamic-branches.mjs" and .symbol == "node:crypto.sign" and .additionalContext == "signature" and (.offset? == null)))' bomresults/bom-cbom-js-fixture.json
          jq -e 'any(.components[]; .type == "cryptographic-asset" and .name == "sha-256" and any((.properties // [])[]; .name == "cdx:crypto:sourceType" and .value == "js-ast:node:crypto.sign") and any((.evidence.occurrences // [])[]; .location == "dynamic-branches.mjs" and .symbol == "node:crypto.sign" and .additionalContext == "signature" and (.offset? == null)))' bomresults/bom-cbom-js-fixture.json
          jq -e 'any(.components[]; .type == "cryptographic-asset" and .name == "sha256WithRSAEncryption" and any((.properties // [])[]; .name == "cdx:crypto:sourceType" and .value == "js-ast:jsonwebtoken.sign"))' bomresults/bom-cbom-js-fixture.json
          jq -e 'any(.components[]; .type == "cryptographic-asset" and .name == "sha512WithRSAEncryption" and any((.properties // [])[]; .name == "cdx:crypto:sourceType" and .value == "js-ast:jsonwebtoken.sign"))' bomresults/bom-cbom-js-fixture.json
          jq -e 'any(.components[]; .type == "cryptographic-asset" and .name == "aes256-CBC" and any((.properties // [])[]; .name == "cdx:crypto:sourceType" and .value == "js-ast:webcrypto.generateKey"))' bomresults/bom-cbom-js-fixture.json
          jq -e 'any(.components[]; .type == "cryptographic-asset" and .name == "sha-512" and any((.evidence.occurrences // [])[]; .location == "dynamic-branches.mjs" and .line == 40 and .symbol == "node:crypto.sign" and .additionalContext == "signature" and (.offset? == null)))' bomresults/bom-cbom-js-fixture.json
          jq -e 'any(.components[]; .type == "cryptographic-asset" and .name == "sha-384" and any((.evidence.occurrences // [])[]; .location == "dynamic-branches.mjs" and .line == 62 and .symbol == "node:crypto.sign" and .additionalContext == "signature" and (.offset? == null)))' bomresults/bom-cbom-js-fixture.json
          jq -e 'all(.components[]? | select(.type == "cryptographic-asset" and .cryptoProperties.assetType == "algorithm"); .cryptoProperties.oid != null)' bomresults/bom-cbom-js-fixture.json
          jq -e 'any(.components[]; ((.purl // "") | startswith("pkg:npm/left-pad@1.3.0")) and any((.evidence.occurrences // [])[]; (.location // "") | contains("src/used/index.js")))' bomresults/bom-atom-exclude-fixture.json
          jq -e 'all(.components[]?; all((.evidence.occurrences // [])[]?; (((.location // "") | contains("ignored")) | not)))' bomresults/bom-atom-exclude-fixture.json
          jq -e 'all(.components[]? | select((.purl // "") | startswith("pkg:npm/is-odd@3.0.1")); ((.evidence.occurrences // []) | length) == 0)' bomresults/bom-atom-exclude-fixture.json
          bin/cdxgen.js -t js test/data/type-only-repotest -o bomresults/bom-type-only-fixture.json --fail-on-error
          jq -e 'any(.components[]; .name == "is-odd" and .scope == "excluded" and any((.properties // [])[]; .name == "cdx:npm:package:type-only" and .value == "true"))' bomresults/bom-type-only-fixture.json
          jq -e 'any(.components[]; .name == "is-even" and .scope == "required")' bomresults/bom-type-only-fixture.json
          jq -e 'any(.components[]; .name == "is-number" and .scope == "optional")' bomresults/bom-type-only-fixture.json
        shell: bash
      - name: repotests gguf ai fixture
        if: needs.lane.outputs.docs-only != 'true'
        run: |

name: v13 differential

# Differential v12-vs-v13 BOM comparison over the golden scenario corpus.
#
# Manual only. It is slow, because it installs and invokes a second cdxgen
# version, and the comparison is a release-time question rather than a
# per-change one — the golden corpus already gates every push. Run it by hand
# from the Actions tab when a v12-vs-v13 comparison is actually wanted.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXUS_URL: ${{ secrets.NEXUS_URL }}

permissions: {}

jobs:
  diff-v12-v13:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: pnpm install
        run: pnpm install:frozen
      - name: Run v12-vs-v13 differential comparison
        run: node ci/diff-v12-v13.js
        env:
          CI: true

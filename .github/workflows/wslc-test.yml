name: wslc container scan

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/wslc-test.yml'
      - 'lib/managers/docker.js'
      - 'lib/managers/docker.poku.js'
  pull_request:
    paths:
      - '.github/workflows/wslc-test.yml'
      - 'lib/managers/docker.js'
      - 'lib/managers/docker.poku.js'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: {}

jobs:
  wslc-oci-scan:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Install dependencies
        shell: bash
        run: pnpm install:frozen
      - name: Ensure WSL with wslc is available
        shell: pwsh
        run: |
          wsl --version
          # wslc (WSL Containers) needs WSL 2.9.3+. Update WSL first, then fall
          # back to the GitHub-released MSI when the update service is
          # unavailable on the runner image.
          wsl --update | Out-Host
          # The update may have just added wslc's directory to the machine
          # PATH, which the current process does not pick up on its own.
          $refreshPath = {
            $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
          }
          & $refreshPath
          $wslc = Get-Command wslc -ErrorAction SilentlyContinue
          if (-not $wslc) {
            Write-Output 'wslc not on PATH after wsl --update; installing the WSL MSI release'
            $msi = Join-Path $env:TEMP 'wsl.msi'
            curl.exe -fsSL -o $msi https://github.com/microsoft/WSL/releases/download/3.0.1/wsl.3.0.1.0.x64.msi
            if ($LASTEXITCODE -ne 0) { throw "WSL MSI download failed with $LASTEXITCODE" }
            # Digest published with the microsoft/WSL 3.0.1 release asset.
            $expectedSha256 = '28b1a0d013640a2ac95898ea705fa186e5b4ff767a1c1b49257161bc106599c6'
            $actualSha256 = (Get-FileHash -Algorithm SHA256 $msi).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $expectedSha256) { throw "WSL MSI digest mismatch: $actualSha256" }
            msiexec /i $msi /qn /norestart | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "WSL MSI install failed with $LASTEXITCODE" }
            & $refreshPath
            $wslc = Get-Command wslc -ErrorAction SilentlyContinue
          }
          if (-not $wslc) {
            $candidate = 'C:\Program Files\WSL\wslc.exe'
            if (Test-Path $candidate) { $env:Path += ';' + (Split-Path $candidate) }
          }
          wslc version
          if ($LASTEXITCODE -ne 0) { throw 'wslc version failed' }
          # Later steps run in fresh processes that inherit the runner agent's
          # environment, not this session's PATH; export wslc's directory via
          # GITHUB_PATH so node's spawnSync can resolve it too.
          $wslcDir = Split-Path (Get-Command wslc).Source
          Add-Content $env:GITHUB_PATH $wslcDir
          Write-Output "wslc added to PATH for subsequent steps: $wslcDir"
          if (Get-Command docker -ErrorAction SilentlyContinue) {
            Write-Output "docker CLI present: $((Get-Command docker).Source)"
          } else {
            Write-Output 'docker CLI absent; cdxgen auto-selects wslc'
          }
      - name: Free disk space and prepare a temp dir on the workspace drive
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}},@{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}
          # The full cdxgen image needs several GB for the WSL session store,
          # the exported tar, and the extracted layers. Drop the preinstalled
          # Android SDKs and stale temp files to make room on C:.
          foreach ($dir in 'C:\Android', 'C:\Program Files\Android', 'C:\Program Files (x86)\Android') {
            if (Test-Path $dir) { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $dir }
          }
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:TEMP\docker-images-*"
          New-Item -ItemType Directory -Force -Path 'D:\cdxtmp' | Out-Null
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}},@{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}
      - name: Scan a small image with auto-selected wslc
        shell: bash
        env:
          CDXGEN_DEBUG_MODE: debug
          TMP: 'D:\cdxtmp'
          TEMP: 'D:\cdxtmp'
        run: |
          # windows-latest images ship a docker CLI bound to a Windows
          # containers daemon. Hide it by dropping the directory it resolves to
          # from PATH, so cdxgen's CLI auto-detection falls through to wslc,
          # matching a WSL-only host with no Docker install.
          if command -v docker >/dev/null 2>&1; then
            DOCKER_BIN="$(dirname "$(command -v docker)")"
            export PATH="$(echo "$PATH" | tr ':' '\n' | grep -vxF "$DOCKER_BIN" | paste -sd: -)"
          fi
          if command -v docker >/dev/null 2>&1; then
            echo "docker CLI still visible on PATH: $(command -v docker)"
            echo "$PATH" | tr ':' '\n'
            exit 1
          fi
          node bin/cdxgen.js -t oci -o bom-alpine.cdx.json alpine:3.20 2>&1 | tee alpine-scan.log
          grep -q "Using wslc (WSL Containers) as the container CLI" alpine-scan.log
          grep -q "using wslc cli" alpine-scan.log
          grep -q "container-cli:wslc" alpine-scan.log
          # The parent purl carries the digest, so wslc image inspect returned
          # docker-compatible RepoTags and RepoDigests.
          node -e "const b=require('./bom-alpine.cdx.json'); if(!b.components||b.components.length<10){throw new Error('expected OS components in the alpine BOM, got '+b.components?.length)}; const p=b.metadata?.component?.purl||''; if(!p.startsWith('pkg:oci/alpine@sha256:')){throw new Error('expected a digest-pinned parent purl, got '+p)}; console.log('alpine BOM components:', b.components.length, 'parent:', p)"
          # A second scan must reuse the image from the wslc store: the local
          # check asks wslc image inspect about the reference itself.
          node bin/cdxgen.js -t oci -o bom-alpine-cached.cdx.json alpine:3.20 2>&1 | tee alpine-rescan.log
          grep -q "wslc image inspect alpine:3.20" alpine-rescan.log
          if grep -q "wslc pull alpine:3.20" alpine-rescan.log; then
            echo "expected the rescan to reuse alpine:3.20 from the wslc image store"
            exit 1
          fi
          # A missing image fails with wslc's own error and a wslc pull hint.
          node bin/cdxgen.js -t oci -o bom-missing.cdx.json docker.io/cdxgen/no-such-image:missing > missing-scan.log 2>&1 || true
          cat missing-scan.log | grep -v "ACT-" || true
          grep -q "Try manually pulling this image using wslc pull docker.io/cdxgen/no-such-image:missing" missing-scan.log
          if grep -q "to use an alternative command such as nerdctl or podman" missing-scan.log; then
            echo "wslc pull errors must not be replaced by the DOCKER_CMD hint"
            exit 1
          fi
      - name: Suggest wslc when the docker CLI cannot pull Linux images
        shell: bash
        env:
          TMP: 'D:\cdxtmp'
          TEMP: 'D:\cdxtmp'
        run: |
          # The runner's docker CLI talks to a Windows containers daemon, the
          # same state as Docker Desktop switched to Windows containers.
          # cdxgen keeps docker but points at the installed wslc.
          if ! command -v docker >/dev/null 2>&1; then
            echo "docker CLI not installed on this runner image; nothing to check"
            exit 0
          fi
          node bin/cdxgen.js -t oci -o bom-docker.cdx.json alpine:3.20 > docker-scan.log 2>&1 || true
          cat docker-scan.log
          grep -q "using docker pull alpine:3.20" docker-scan.log
          grep -q "Set the environment variable DOCKER_CMD=wslc" docker-scan.log
      - name: Scan a published cdxgen image with wslc
        shell: bash
        env:
          # Force the DOCKER_CMD override path here: the runner's docker CLI is
          # installed, so auto-detection would otherwise keep docker.
          DOCKER_CMD: wslc
          TMP: 'D:\cdxtmp'
          TEMP: 'D:\cdxtmp'
        run: |
          # Drop the alpine image from the wslc session store before pulling
          # the much larger cdxgen image.
          wslc image remove alpine:3.20 || true
          node bin/cdxgen.js -t oci -o bom-cdxgen.cdx.json ghcr.io/cdxgen/cdxgen:latest
          node -e "const b=require('./bom-cdxgen.cdx.json'); if(!b.components||b.components.length<50){throw new Error('expected components in the cdxgen image BOM, got '+b.components?.length)}; const mc=b.metadata&&b.metadata.component; if(!mc||mc.type!=='container'){throw new Error('expected a container parent component')}; console.log('cdxgen image BOM components:', b.components.length, 'parent:', mc.name)"
      - name: Upload BOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wslc-boms
          path: |
            bom-alpine.cdx.json
            bom-cdxgen.cdx.json

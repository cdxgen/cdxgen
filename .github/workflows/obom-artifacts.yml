name: OBOM artifact capture

on:
  workflow_dispatch:

permissions: {}

jobs:
  generate-obom:
    name: Generate OBOM (${{ matrix.runner }})
    permissions: {}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-15
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        shell: bash
        run: pnpm install:frozen
      - name: Generate OBOM with runtime audit
        id: generate
        shell: bash
        run: |
          set +e
          report_dir="reports/${{ matrix.runner }}"
          mkdir -p "$report_dir"
          {
            echo "runner=${{ matrix.runner }}"
            echo "runner_os=${{ runner.os }}"
            echo "runner_arch=${{ runner.arch }}"
            echo "repository=${{ github.repository }}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${{ github.sha }}"
          } > "$report_dir/run-info.txt"
          node bin/cdxgen.js \
            -t os \
            --bom-audit \
            -o "$report_dir/obom.json" \
            . > "$report_dir/out.txt" 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo "$exit_code" > "$report_dir/exit-code.txt"
          exit 0
      - name: Upload OBOM artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: obom-${{ matrix.runner }}
          if-no-files-found: error
          path: reports/${{ matrix.runner }}/
      - name: Fail workflow when OBOM generation fails
        if: steps.generate.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "OBOM generation failed on ${{ matrix.runner }} with exit code ${STEPS_GENERATE_OUTPUTS_EXIT_CODE}"
          exit 1
        env:
          STEPS_GENERATE_OUTPUTS_EXIT_CODE: ${{ steps.generate.outputs.exit_code }}

name: Project sync

# Keeps the cdxgen roadmap project in step with issues and pull requests, for
# the cases the project's built-in workflows cannot handle. See
# https://github.com/cdxgen/.github/tree/main/project
on:
  issues:
    types: [labeled, unlabeled]
  pull_request_target:
    types: [opened, reopened, edited, ready_for_review, converted_to_draft, closed, labeled]

concurrency:
  group: project-sync-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    permissions:
      contents: read
    uses: cdxgen/.github/.github/workflows/project-sync.yml@9e476b9489d771ac7118e04053240a64da0be8f7  # main
    with:
      project-number: ${{ vars.PROJECT_NUMBER }}
      ref: 9e476b9489d771ac7118e04053240a64da0be8f7
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}

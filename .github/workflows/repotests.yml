          using System.Security.Cryptography;
          using System.Text;
          using Microsoft.AspNetCore.Mvc;
          using Newtonsoft.Json;

          var builder = WebApplication.CreateBuilder(args);
          builder.Services.AddControllers();
          var app = builder.Build();
          app.MapControllers();
          app.MapGet("/api/ping", () => Results.Ok(new { Message = "pong" }));
          app.Run();

          [ApiController]
          [Route("api/[controller]")]
          public sealed class PodcastsController : ControllerBase
          {
              [HttpGet("{id}")]
              public IActionResult Get(int id)
              {
                  var payload = JsonConvert.SerializeObject(new { Id = id, Name = "cdxgen" });
                  var digest = SHA256.HashData(Encoding.UTF8.GetBytes(payload));
                  return Ok(new { payload, digest = Convert.ToHexString(digest) });
              }
          }
          EOF
          dotnet restore
          cd "$GITHUB_WORKSPACE"
          bin/cdxgen.js -r -t dotnet repotests/dotnet-api-smoke -o bomresults/bom-dotnet-api-smoke.json --profile research --spec-version 1.6 --export-proto
          node --input-type=module <<'EOF'
          import { existsSync, readFileSync } from "node:fs";
          import { join } from "node:path";

          import { resolveCdxgenPlugins } from "./lib/inventory/plugins.js";
          import { validateBom } from "./lib/validator/bomValidator.js";

          // dosai ships in the optional plugins-bin package, so its evidence can
          // only be asserted when the binary resolved for this platform.
          const { pluginsDir } = resolveCdxgenPlugins();
          const hasDosai =
            Boolean(pluginsDir) && existsSync(join(pluginsDir, "dosai"));

          const bomFile = "bomresults/bom-dotnet-api-smoke.json";
          const bom = JSON.parse(readFileSync(bomFile, "utf-8"));
          const dosaiTool = bom.metadata?.tools?.components?.some(
            (component) => component.name === "dosai",
          );
          const services = bom.services || [];
          const components = bom.components || [];
          const occurrenceComponents = components.filter(
            (component) => (component.evidence?.occurrences || []).length > 0,
          );
          const dllOccurrences = occurrenceComponents.flatMap((component) =>
            (component.evidence?.occurrences || []).filter((occurrence) =>
              String(occurrence.location || "").toLowerCase().endsWith(".dll"),
            ),
          );
          const cryptoAssets = components.filter(
            (component) => component.type === "cryptographic-asset",
          );
          const duplicateServices =
            services.length -
            new Set(services.map((service) => JSON.stringify(service))).size;
          const serviceLeaks = JSON.stringify(services).match(
            /sig=|access_token|client_secret|InternalPolicyName/i,
          );
          const schemaValid = validateBom(bom);

          if (!schemaValid) {
            throw new Error("dotnet-api-smoke BOM is not schema-valid");
          }
          if (hasDosai && !dosaiTool) {
            throw new Error("Expected dosai tool metadata in deep .NET BOM");
          }
          if (hasDosai && services.length < 1) {
            throw new Error(
              "Expected dosai ApiEndpoints to produce SaaSBOM services",
            );
          }
          if (duplicateServices !== 0) {
            throw new Error(
              `Expected unique services, found ${duplicateServices} duplicates`,
            );
          }
          if (serviceLeaks) {
            throw new Error(
              `Service metadata appears to leak sensitive endpoint/auth data: ${serviceLeaks[0]}`,
            );
          }
          if (hasDosai && occurrenceComponents.length < 1) {
            throw new Error("Expected dosai PackageReachability occurrence evidence");
          }
          if (dllOccurrences.length) {
            throw new Error(
              `Expected source-only occurrence evidence, found ${dllOccurrences.length} DLL locations`,
            );
          }
          if (hasDosai && cryptoAssets.length < 1) {
            throw new Error(
              "Expected dosai crypto analysis to produce CBOM components under research profile",
            );
          }
          if (!cryptoAssets.every((component) => !component.purl)) {
            throw new Error("Cryptographic assets must not have purls");
          }
          // A project's purl carries the version it builds as, never a
          // "latest" placeholder, and a package's purl names its own version.
          const projects = [
            bom.metadata?.component,
            ...(bom.metadata?.component?.components || []),
          ].filter(Boolean);
          for (const component of [...projects, ...components]) {
            if (!component.purl?.startsWith("pkg:nuget/")) {
              continue;
            }
            if (component.purl.endsWith("@latest")) {
              throw new Error(`Placeholder version in ${component.purl}`);
            }
            const purlVersion = component.purl.includes("@")
              ? decodeURIComponent(component.purl.split("@").pop())
              : undefined;
            if (purlVersion !== component.version) {
              throw new Error(
                `${component.purl} disagrees with version ${component.version}`,
              );
            }
          }
          console.log(
            JSON.stringify({
              hasDosai,
              dosaiTool,
              services: services.length,
              occurrenceComponents: occurrenceComponents.length,
              cryptoAssets: cryptoAssets.length,
            }),
          );
          EOF
          bin/cdxgen.js -r -t dotnet repotests/react-native-windows -o bomresults/bom-react-native-windows.json
          rm -rf repotests/dotnet-paket repotests/dotnet-podcasts repotests/react-native-windows repotests/dotnet-api-smoke || true
        shell: bash
      - name: repotests dotnet VB and F# dosai evidence

        run: |
          CDXGEN_ALLOWED_COMMANDS=mvn bin/cdxgen.js -t java ${GITHUB_WORKSPACE}/repotests/java-sec-code -o ${GITHUB_WORKSPACE}/bomresults/bom-java-sec-code-1.json --fail-on-error
          CDXGEN_ALLOWED_COMMANDS=mvn bin/cdxgen.js -t java ${GITHUB_WORKSPACE}/repotests/java-sec-code -o ${GITHUB_WORKSPACE}/bomresults/bom-java-sec-code-2.json --author foo --author bar --standard asvs-4.0.3
          CDXGEN_ALLOWED_COMMANDS=mvn bin/cdxgen.js -t java ${GITHUB_WORKSPACE}/repotests/java-sec-code -o ${GITHUB_WORKSPACE}/bomresults/bom-java-sec-code-3.json --required-only --fail-on-error
          CDXGEN_ALLOWED_COMMANDS=mvn bin/cdxgen.js -t java ${GITHUB_WORKSPACE}/repotests/java-sec-code -o ${GITHUB_WORKSPACE}/bomresults/bom-java-sec-code-4.json --filter postgres --filter json
          CDXGEN_ALLOWED_COMMANDS=mvn bin/cdxgen.js -r -t quarkus ${GITHUB_WORKSPACE}/repotests/quarkus-quickstarts -o ${GITHUB_WORKSPACE}/bomresults/bom-quarkus-quickstarts-quarkus.json --no-recurse --fail-on-error
          CDXGEN_ALLOWED_COMMANDS=npm bin/cdxgen.js -t js -o ${GITHUB_WORKSPACE}/bomresults/bom-iot.json ${GITHUB_WORKSPACE}/repotests/iot-device-simulator --fail-on-error
        shell: bash
        env:
          NODE_OPTIONS: "--permission --allow-fs-read=/home/runner/* --allow-fs-read=/tmp/* --allow-fs-read=/run/user/1001/* --allow-fs-read=/opt/hostedtoolcache/* --allow-fs-write=/tmp/* --allow-fs-read=/Users/runner/* --allow-fs-read=${{ github.workspace }}/* --allow-fs-write=${{ github.workspace }}/bomresults/*.json --allow-fs-read=${{ runner.temp }}/* --allow-fs-write=${{ runner.temp }}/* --allow-child-process --trace-warnings"
          CDXGEN_TEMP_DIR: ${{ runner.temp }}/cdxgen-repotests
          CDXGEN_TRACE_ID: foo
          CDXGEN_DEBUG_MODE: debug

  introspection:
    # The build-introspection vendored fixture matrix: healthy rows must stay
    # silent, ceiling and unsupported rows must be reported without noise, and
    # the two vendored transition rows must repair through the actions their
    # own reports emitted. Group B and C need only manifests and lockfiles;
    # the maven transition needs java and maven, which the hosted runners
    # provide.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip-repotests') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      # go-smoke ships no go.sum, so its `resolved` row needs a real go
      # toolchain; the macOS images carry none. The row skips itself when go
      # is absent, and this keeps it measured on all three platforms.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.0'
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed  # v2.0.5
        if: matrix.os == 'ubuntu-latest'
        with:
          deno-version: 2.9.6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.os == 'ubuntu-latest'
        with:
          bun-version: 1.3.14
      - name: pnpm install
        run: pnpm install:frozen
      - name: Vendored introspection matrix
        run: bash ci/introspection-tests.sh
        shell: bash
        env:
          CDXGEN_TEMP_DIR: ${{ runner.temp }}/cdxgen-introspection
      - name: Cross-runtime gate (deno and bun)
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash ci/introspection-tests.sh --with-runtimes
        shell: bash
        env:
          CDXGEN_TEMP_DIR: ${{ runner.temp }}/cdxgen-introspection
      - name: Checkout the public repo row
        if: matrix.os == 'ubuntu-latest'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: 'hoolicorp/java-sec-code'
          path: 'repotests/java-sec-code'
      - name: Public repo passes the fidelity gate
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p bomresults
          node bin/cdxgen.js --profile introspect --introspect-fail-below 70 -t java --no-install-deps -o bomresults/introspection-java-sec-code.json repotests/java-sec-code
        shell: bash

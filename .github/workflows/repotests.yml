          CDXGEN_DEBUG_MODE=verbose ASTGEN_IGNORE_DIRS="" node bin/evinse.js -i bomresults/bom-svelte.json -o bomresults/bom-svelte.evinse.json -l js --with-data-flow repotests/sveltejs-examples
          CDXGEN_DEBUG_MODE=verbose ASTGEN_IGNORE_DIRS="" node bin/evinse.js -i bomresults/bom-svelte.json -o bomresults/bom-svelte.evinse.json -l js --with-reachables repotests/sveltejs-examples
        shell: bash
      - name: repotests svelte analyzer fixtures
        run: |
          bin/cdxgen.js -t svelte test/data/svelte-repotest -o bomresults/bom-svelte-kit-fixture.json --deep --evidence --fail-on-error
          bin/cdxgen.js -t svelte test/data/svelte-legacy-repotest -o bomresults/bom-svelte-legacy-fixture.json --deep --evidence --fail-on-error
          bin/cdxgen.js -t svelte test/data/svelte-precision -o bomresults/bom-svelte-precision-fixture.json --deep --evidence --fail-on-error
          FETCH_LICENSE=false bin/cdxgen.js -t svelte repotests/sveltejs-realworld -o bomresults/bom-svelte-realworld.json --fail-on-error
          jq -e 'any(.components[]; .group == "@sveltejs" and .name == "kit" and .scope == "required")' bomresults/bom-svelte-kit-fixture.json
          jq -e 'any(.components[]; .group == "@sveltejs" and .name == "adapter-node" and .scope == "required")' bomresults/bom-svelte-kit-fixture.json
          jq -e 'any(.components[]; .name == "svelte" and .scope == "required")' bomresults/bom-svelte-kit-fixture.json
          jq -e 'any(.components[]; .name == "chart.js" and .scope == "required")' bomresults/bom-svelte-kit-fixture.json
          jq -e 'any(.components[]; .name == "dayjs" and .scope == "required")' bomresults/bom-svelte-kit-fixture.json
          jq -e 'any(.components[]; .name == "bulma" and .scope == "required")' bomresults/bom-svelte-kit-fixture.json
          jq -e 'any(.components[]; .name == "sass" and .scope == "required")' bomresults/bom-svelte-kit-fixture.json
          jq -e 'any(.components[]; .name == "left-pad" and .scope == "optional")' bomresults/bom-svelte-kit-fixture.json
          jq -e 'any(.components[]; .name == "svelte" and .scope == "required")' bomresults/bom-svelte-legacy-fixture.json
          jq -e 'any(.components[]; .name == "date-fns" and .scope == "required")' bomresults/bom-svelte-legacy-fixture.json
          jq -e 'any(.components[]; .name == "left-pad" and .scope == "optional")' bomresults/bom-svelte-legacy-fixture.json
          jq -e 'any(.components[]; .name == "svelte" and .scope == "required")' bomresults/bom-svelte-precision-fixture.json
          jq -e 'any(.components[]; .name == "dayjs" and .scope == "required")' bomresults/bom-svelte-precision-fixture.json
          jq -e 'any(.components[]; .name == "left-pad" and .scope == "optional")' bomresults/bom-svelte-precision-fixture.json
          jq -e 'any(.components[]; .name == "svelte" and .scope == "required")' bomresults/bom-svelte-realworld.json
          jq -e 'any(.components[]; .group == "@sveltejs" and .name == "kit" and .scope == "required")' bomresults/bom-svelte-realworld.json
          jq -e 'any(.components[]; .group == "@sveltejs" and .name == "adapter-vercel" and .scope == "required")' bomresults/bom-svelte-realworld.json
        shell: bash
      - name: Install php for the evinse PHP frontend
        if: runner.os == 'macOS'
        run: brew install php
        shell: bash
      - name: repotests evinse language coverage (python, php, c)
        run: |
          set -e
          # In-repo fixtures exercising the atom 3 frontends that previously had
          # no evinse CI coverage. PHP is the one that would regress silently:
          # it depends on cdxgen bypassing the dispatcher's PHP_PARSER_BIN
          # clobber, so a broken bypass shows up here as zero slices.
          #
          # Ruby is deliberately absent: atom 3's Ruby frontend requires Ruby
          # 4.0.x and this runner ships 3.x, so it emits zero slices and any
          # assertion here would be ceremonial. Ruby coverage belongs in the
          # ruby4 container image job.
          #
          # atom caches ASTs in a .chen directory inside the source tree and a
          # stale cache from an interrupted run makes the next run fail; start
          # from a clean tree so a CI failure means a real failure.
          find test/data/evinse-python-repotest test/data/evinse-php-repotest test/data/evinse-cpp-repotest -name .chen -type d -exec rm -rf {} + 2>/dev/null || true

          # evinse warns and exits 0 when atom produces nothing, so each
          # language asserts a minimum usages-slice count instead of just a
          # zero exit. Only slices that name a method or file count: an atom
          # built from body-less ASTs writes placeholder slices named
          # "<empty>", which must not pass for real ones.
          assert_slices() {
            node -e '
              const { existsSync, readFileSync } = require("node:fs");
              const [label, file, minimum] = process.argv.slice(1);
              if (!existsSync(file)) {
                console.error(`${label}: no usages slices file was written; atom did not run.`);
                process.exit(1);
              }
              const count = (JSON.parse(readFileSync(file, "utf8")).objectSlices || []).filter(
                (slice) => slice.fullName && slice.fullName !== "<empty>",
              ).length;
              if (count < Number(minimum)) {
                console.error(`${label}: ${count} object slice(s), expected at least ${minimum}.`);
                process.exit(1);
              }
              console.log(`${label}: ${count} object slice(s).`);
            ' "$1" "$2" "$3"
          }

          bin/cdxgen.js -t php test/data/evinse-php-repotest -o bomresults/bom-php-evinse.json --fail-on-error
          node bin/evinse.js -i bomresults/bom-php-evinse.json -o bomresults/bom-php.evinse.json -l php --with-reachables --usages-slices-file bomresults/php-usages.slices.json test/data/evinse-php-repotest
          assert_slices php bomresults/php-usages.slices.json 3

          bin/cdxgen.js -t c test/data/evinse-cpp-repotest -o bomresults/bom-c-evinse.json --fail-on-error
          node bin/evinse.js -i bomresults/bom-c-evinse.json -o bomresults/bom-c.evinse.json -l c --with-reachables --usages-slices-file bomresults/c-usages.slices.json test/data/evinse-cpp-repotest
          assert_slices c bomresults/c-usages.slices.json 4

          bin/cdxgen.js -t python test/data/evinse-python-repotest -o bomresults/bom-python-evinse.json --fail-on-error
          node bin/evinse.js -i bomresults/bom-python-evinse.json -o bomresults/bom-python.evinse.json -l python --with-reachables --usages-slices-file bomresults/python-usages.slices.json test/data/evinse-python-repotest
          assert_slices python bomresults/python-usages.slices.json 6
        shell: bash

  go-dataflow-fixture-hosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip-repotests') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.0'
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: pnpm install
        run: |
          pnpm install:frozen
          mkdir -p bomresults
      - name: repotests go data-flow and crypto-flow fixture
        run: |
          mkdir -p "$GOCACHE" "$GOMODCACHE"
          cd test/data/go-dataflow-repotest
          go mod download all
          go mod tidy
          go list -deps ./... >/dev/null
          cd "$GITHUB_WORKSPACE"

          GOLEM_CMD="$(node --input-type=module <<'EOF'
          import { resolvePluginBinary } from "./lib/inventory/plugins.js";

          const cmd = resolvePluginBinary("golem");
          if (cmd) {
            console.log(cmd);
          }
          EOF
          )"
          if [ -z "$GOLEM_CMD" ]; then
            echo "Unable to resolve the bundled golem plugin binary" >&2
            exit 1
          fi
          node --input-type=module - "$GOLEM_CMD" <<'EOF'
          import { spawnSync } from "node:child_process";

          const cmd = process.argv[2];
          const result = spawnSync(cmd, ["analyze", "--help"], {
            encoding: "utf-8",
          });
          const output = `${result.stdout || ""}${result.stderr || ""}`;
          if (!output.includes("-dataflow")) {
            throw new Error(
              "The bundled golem plugin does not expose data-flow flags",
            );
          }
          EOF

          bin/cdxgen.js -t go test/data/go-dataflow-repotest -o bomresults/bom-go-dataflow-fixture.json --fail-on-error
          GOLEM_CMD="$GOLEM_CMD" node bin/evinse.js -i bomresults/bom-go-dataflow-fixture.json -o bomresults/bom-go-dataflow-fixture.evinse.json -l go --deep test/data/go-dataflow-repotest
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";

          import { validateBom } from "./lib/validator/bomValidator.js";

          const bom = JSON.parse(
            readFileSync("bomresults/bom-go-dataflow-fixture.evinse.json", "utf-8"),
          );
          const components = bom.components || [];
          const allComponents = [bom.metadata?.component, ...components].filter(
            Boolean,
          );
          const propertyValues = (component, name) =>
            (component.properties || [])
              .filter((property) => property.name === name)
              .map((property) => property.value);
          const hasProperty = (component, name, predicate = Boolean) =>
            propertyValues(component, name).some((value) => predicate(value));
          const numericProperty = (component, name) =>
            Math.max(0, ...propertyValues(component, name).map((value) => Number(value) || 0));
          const metadata = bom.metadata?.component;
          const app = allComponents.find(
            (component) =>
              component.purl === "pkg:golang/github.com/cdxgen/go-dataflow-repotest",
          );
          const xCrypto = components.find((component) =>
            component.purl?.startsWith("pkg:golang/golang.org/x/crypto@"),
          );
          const cryptoAssets = components.filter(
            (component) => component.type === "cryptographic-asset",
          );
          const aes = cryptoAssets.find(
            (component) => component.name === "aes",
          );
          const sha256 = cryptoAssets.find(
            (component) => component.name === "sha-256",
          );
          const serialized = JSON.stringify(bom);

          if (!validateBom(bom)) {
            throw new Error("Go data-flow Evinse BOM is not schema-valid");
          }
          const hasDataFlowCoverage =
            numericProperty(metadata, "cdx:golem:dataFlowSliceCount") > 0 ||
            numericProperty(metadata, "cdx:golem:dataFlowNodeCount") > 0 ||
            numericProperty(metadata, "cdx:golem:dataFlowSummaryCount") > 0;
          if (!hasDataFlowCoverage) {
            throw new Error("Expected positive golem data-flow coverage counters");
          }
          if (numericProperty(metadata, "cdx:golem:cryptoAssetCount") < 1) {
            throw new Error("Expected positive metadata property cdx:golem:cryptoAssetCount");
          }
          if (!app) {
            throw new Error("Expected main Go module component evidence");
          }
          const hasCryptoFlowSignal =
            hasProperty(app, "cdx:golem:cryptoDataFlow", (value) => value === "true") ||
            hasProperty(app, "cdx:golem:dataFlowCategories", (value) => value.includes("crypto")) ||
            numericProperty(metadata, "cdx:golem:cryptoOperationCount") > 0;
          if (!hasCryptoFlowSignal) {
            throw new Error("Expected crypto-flow evidence signal in golem metadata or component properties");
          }
          if ((app.evidence?.callstack?.frames || []).length < 1) {
            throw new Error("Expected call-stack frames for Go data-flow evidence");
          }
          if ((app.evidence?.occurrences || []).length < 1) {
            throw new Error("Expected occurrence evidence for Go data-flow evidence");
          }
          if (!xCrypto || (xCrypto.evidence?.occurrences || []).length < 1) {
            throw new Error("Expected golang.org/x/crypto occurrence evidence");
          }
          if ((xCrypto.evidence?.callstack?.frames || []).length < 1) {
            throw new Error("Expected golang.org/x/crypto call-stack evidence");
          }
          if (!aes || aes.cryptoProperties?.assetType !== "algorithm" || !aes.cryptoProperties?.oid) {
            throw new Error("Expected AES cryptographic asset with an OID");
          }
          if (!sha256 || sha256.cryptoProperties?.assetType !== "algorithm" || !sha256.cryptoProperties?.oid) {
            throw new Error("Expected SHA-256 cryptographic asset with an OID");
          }
          if (!cryptoAssets.every((component) => !component.purl)) {
            throw new Error("Cryptographic assets must not have purls");
          }
          if (/APP_KEY|payload/.test(serialized)) {
            throw new Error("Go crypto-flow evidence leaked fixture secret-bearing values");
          }
          console.log(
            JSON.stringify({
              cryptoAssets: cryptoAssets.length,
              appOccurrences: app.evidence.occurrences.length,
              appCallstackFrames: app.evidence.callstack.frames.length,
              xCryptoOccurrences: xCrypto.evidence.occurrences.length,
            }),
          );
          EOF
        shell: bash
        env:
          GOCACHE: ${{ runner.temp }}/go-build-cache
          GOFLAGS: ""
          GOMODCACHE: ${{ runner.temp }}/go-mod-cache
          GOPROXY: https://proxy.golang.org,direct
          GOTOOLCHAIN: auto
          GOWORK: off

  rust-dataflow-fixture-hosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip-repotests') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install nightly --component rustc-dev --component rust-src
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: pnpm install
        run: |
          pnpm install:frozen
          mkdir -p bomresults
      - name: repotests rust data-flow and crypto-flow fixture
        run: |
          if [ -d "test/data/rust-dataflow-repotest" ]; then
            cd test/data/rust-dataflow-repotest
            cargo fetch || true
            cd "$GITHUB_WORKSPACE"
          fi

          RUSI_CMD="$(node --input-type=module <<'EOF'
          import { resolvePluginBinary } from "./lib/inventory/plugins.js";

          const cmd = resolvePluginBinary("rusi");
          if (cmd) {
            console.log(cmd);
          }
          EOF
          )"
          if [ -z "$RUSI_CMD" ]; then
            echo "Unable to resolve the bundled rusi plugin binary" >&2
            exit 1
          fi
          node --input-type=module - "$RUSI_CMD" <<'EOF'
          import { spawnSync } from "node:child_process";

          const cmd = process.argv[2];
          const result = spawnSync(cmd, ["--help"], {
            encoding: "utf-8",
          });
          const output = `${result.stdout || ""}${result.stderr || ""}`;
          if (!output.includes("analyze") && !output.includes("cryptos")) {
            throw new Error(
              "The bundled rusi plugin does not expose expected commands",
            );
          }
          EOF

          # Force crypto and research profile to trigger rusi cryptos mode and deep evidence
          bin/cdxgen.js -t rust test/data/rust-dataflow-repotest -o bomresults/bom-rust-dataflow-fixture.json --include-crypto --profile research --fail-on-error
          RUSI_CMD="$RUSI_CMD" node bin/evinse.js -i bomresults/bom-rust-dataflow-fixture.json -o bomresults/bom-rust-dataflow-fixture.evinse.json -l rust --deep --rusi-backend compiler --rusi-toolchain nightly --with-data-flow test/data/rust-dataflow-repotest

          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";

          import { validateBom } from "./lib/validator/bomValidator.js";

          const bom = JSON.parse(
            readFileSync("bomresults/bom-rust-dataflow-fixture.evinse.json", "utf-8"),
          );
          const components = bom.components || [];
          const propertyValues = (component, name) =>
            (component.properties || [])
              .filter((property) => property.name === name)
              .map((property) => property.value);
          const hasProperty = (component, name, predicate = Boolean) =>
            propertyValues(component, name).some((value) => predicate(value));
          const numericProperty = (component, name) =>
            Math.max(0, ...propertyValues(component, name).map((value) => Number(value) || 0));
          const metadata = bom.metadata?.component;

          const cryptoAssets = components.filter(
            (component) => component.type === "cryptographic-asset",
          );

          if (!validateBom(bom)) {
            throw new Error("Rust data-flow Evinse BOM is not schema-valid");
          }

          // 1. Verify rich rusi metadata counters and modes
          if (!hasProperty(metadata, "cdx:rusi:toolVersion")) {
            throw new Error("Missing cdx:rusi:toolVersion in metadata");
          }
          if (!hasProperty(metadata, "cdx:rusi:callGraphMode")) {
            throw new Error("Missing cdx:rusi:callGraphMode in metadata");
          }
          if (numericProperty(metadata, "cdx:rusi:packageCount") < 1) {
            throw new Error("Expected cdx:rusi:packageCount > 0");
          }
          if (numericProperty(metadata, "cdx:rusi:cryptoLibraryCount") < 1) {
            throw new Error("Expected cdx:rusi:cryptoLibraryCount > 0 (sha2 should be detected)");
          }
          if (numericProperty(metadata, "cdx:rusi:callGraphNodeCount") < 1) {
            throw new Error("Expected cdx:rusi:callGraphNodeCount > 0");
          }

          // 2. Verify component-level rusi evidence (imports, usages, callstacks)
          const appComponent = components.find(c => c.name === "rust-dataflow-repotest" || c.purl?.includes("rust-dataflow-repotest"));
          if (!appComponent) {
             throw new Error("Missing rust-dataflow-repotest component");
          }
          if (!hasProperty(appComponent, "cdx:rusi:importPath", v => v.includes("sha2"))) {
            throw new Error("Expected cdx:rusi:importPath for sha2 on app component");
          }
          if (!hasProperty(appComponent, "cdx:rusi:usageKind")) {
            throw new Error("Expected cdx:rusi:usageKind on app component");
          }
          if ((appComponent.evidence?.occurrences || []).length < 1) {
            throw new Error("Expected occurrence evidence for rust-dataflow-repotest");
          }
          if ((appComponent.evidence?.callstack?.frames || []).length < 1) {
            throw new Error("Expected callstack evidence for rust-dataflow-repotest");
          }

          // 3. Verify crypto assets (if generated by cryptos mode)
          if (cryptoAssets.length > 0) {
            if (!cryptoAssets.every((component) => !component.purl)) {
              throw new Error("Cryptographic assets must not have purls");
            }
            const hasCryptoProperties = cryptoAssets.some(c => 
              hasProperty(c, "cdx:rusi:crypto:sourceLocation") ||
              hasProperty(c, "cdx:rusi:crypto:provider") ||
              hasProperty(c, "cdx:rusi:crypto:operation") ||
              hasProperty(c, "cdx:rusi:crypto:symbol")
            );
            if (!hasCryptoProperties) {
               throw new Error("Expected rusi crypto properties on cryptographic assets");
            }
          }

          console.log(
            JSON.stringify({
              cryptoAssets: cryptoAssets.length,
              rusiPackages: numericProperty(metadata, "cdx:rusi:packageCount"),
              rusiCryptoLibraries: numericProperty(metadata, "cdx:rusi:cryptoLibraryCount"),
              callGraphNodes: numericProperty(metadata, "cdx:rusi:callGraphNodeCount"),
              callstackFrames: appComponent.evidence?.callstack?.frames?.length || 0
            }),
          );
          EOF
        shell: bash

  gradle-fixture-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip-repotests') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: pnpm install
        run: |
          pnpm install:frozen
          mkdir -p bomresults
          rm -rf $CDXGEN_TEMP_DIR && mkdir -p $CDXGEN_TEMP_DIR
        env:
          CI: true
          CDXGEN_TEMP_DIR: ${{ runner.temp }}/cdxgen-repotests
      - name: repotests gradle fixture
        env:
          GRADLE_ARGS: "--refresh-dependencies"
        run: |
          bin/cdxgen.js -t gradle test/data/gradle-repotest -o bomresults/bom-gradle-repotest.json --fail-on-error
          jq -e 'any(.components[]; .group == "org.slf4j" and .name == "slf4j-api" and .version == "2.0.7")' bomresults/bom-gradle-repotest.json
          jq -e 'any(.metadata.tools.components[]?; .group == "org.gradle" and .name == "gradle" and .version == "9.6.0" and any((.externalReferences // [])[]; .type == "distribution" and .url == "https://services.gradle.org/distributions/gradle-9.6.0-bin.zip") and any((.hashes // [])[]; .alg == "SHA-256" and .content == "bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01"))' bomresults/bom-gradle-repotest.json
          bin/cdxgen.js -t gradle test/data/gradle-repotest -o bomresults/bom-gradle-repotest-resolve-dist.json --feature-flags resolve-gradle-distribution --fail-on-error
          jq -e 'any(.components[]; .group == "org.slf4j" and .name == "slf4j-api" and .version == "2.0.7" and any((.externalReferences // [])[]; .type == "distribution" and .url == "https://repo.maven.apache.org/maven2/org/slf4j/slf4j-api/2.0.7/slf4j-api-2.0.7.jar"))' bomresults/bom-gradle-repotest-resolve-dist.json
          jq -e 'any(.components[]; .group == "com.google.android.gms" and .name == "play-services-basement" and any((.externalReferences // [])[]; .type == "distribution" and (.url | contains("dl.google.com"))))' bomresults/bom-gradle-repotest-resolve-dist.json
        shell: bash

  jvm-tools-repotest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip-repotests') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: pnpm install
        run: |
          pnpm install:frozen
          mkdir -p bomresults
          rm -rf $CDXGEN_TEMP_DIR && mkdir -p $CDXGEN_TEMP_DIR
        env:
          CI: true
          CDXGEN_TEMP_DIR: ${{ runner.temp }}/cdxgen-repotests
      - name: setup sdkman
        run: |
          curl -s "https://get.sdkman.io" | bash
      - name: repotests jvm build tools
        run: |
          # cdxgen writes its progress and decision messages to stderr, so
          # every log captured below has to redirect stderr into the file.
          # Explicit pin: installs maven 3.9.9 via sdkman and uses it for a
          # wrapper-less pom project.
          bin/cdxgen.js -t maven3.9.9 test/data/jvm-tools/maven-nowrapper -o bomresults/bom-jvm-tools-pin.json --fail-on-error 2>&1 | tee /tmp/jvm-tools-pin.log
          # Matches whether maven 3.9.9 was installed now or already present,
          # so a warm sdkman cache cannot break this.
          grep -q "maven/3.9.9\|About to install maven 3.9.9" /tmp/jvm-tools-pin.log
          jq -e '.components | length > 0' bomresults/bom-jvm-tools-pin.json
          jq -e 'any(.components[]; .group == "org.slf4j" and .name == "slf4j-api" and .version == "2.0.7")' bomresults/bom-jvm-tools-pin.json
          jq -e 'any(.components[]; .group == "com.fasterxml.jackson.core" and .name == "jackson-databind" and .version == "2.17.0")' bomresults/bom-jvm-tools-pin.json
          # Idempotency: a second run must not reinstall anything.
          bin/cdxgen.js -t maven3.9.9 test/data/jvm-tools/maven-nowrapper -o bomresults/bom-jvm-tools-pin2.json --fail-on-error > /tmp/jvm-tools-pin2.log 2>&1
          # Assert the log has content first, so the negative check below
          # cannot pass just because nothing was captured.
          grep -q "Preparing environment" /tmp/jvm-tools-pin2.log
          ! grep -q "About to install" /tmp/jvm-tools-pin2.log
          # Automatic mode: .sdkmanrc pins are provisioned and honoured.
          bin/cdxgen.js --feature-flags jvm-tool-setup -t java test/data/jvm-tools/sdkmanrc-full -o bomresults/bom-jvm-tools-sdkmanrc.json --fail-on-error 2>&1 | tee /tmp/jvm-tools-sdkmanrc.log
          grep -q "Using maven 3.9.16 from the .sdkmanrc file." /tmp/jvm-tools-sdkmanrc.log
          grep -q "Using gradle 9.6.1 from the .sdkmanrc file." /tmp/jvm-tools-sdkmanrc.log
          grep -q "Using sbt 1.10.11 from the .sdkmanrc file." /tmp/jvm-tools-sdkmanrc.log
          # Automatic mode keeps wrapper-pinned gradle untouched: the project
          # wrapper provisions itself and no gradle install happens.
          bin/cdxgen.js --feature-flags jvm-tool-setup -t java test/data/gradle-repotest -o bomresults/bom-jvm-tools-wrapper.json --fail-on-error > /tmp/jvm-tools-wrapper.log 2>&1
          grep -q "Preparing environment" /tmp/jvm-tools-wrapper.log
          ! grep -q "About to install gradle" /tmp/jvm-tools-wrapper.log
          jq -e 'any(.components[]; .group == "org.slf4j" and .name == "slf4j-api" and .version == "2.0.7")' bomresults/bom-jvm-tools-wrapper.json
        shell: bash



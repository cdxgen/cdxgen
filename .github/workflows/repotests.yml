          dotnet restore
          cd "$GITHUB_WORKSPACE"

          bin/cdxgen.js -t visualbasic repotests/dotnet-language-smoke/vbapp -o bomresults/bom-dotnet-vb-research.json --profile research --spec-version 1.6 --fail-on-error
          node bin/evinse.js -i bomresults/bom-dotnet-vb-research.json -o bomresults/bom-dotnet-vb-research.evinse.json -l vbnet --profile research repotests/dotnet-language-smoke/vbapp
          bin/cdxgen.js -t fs repotests/dotnet-language-smoke/fsapp -o bomresults/bom-dotnet-fs-research.json --profile research --spec-version 1.6 --fail-on-error
          node bin/evinse.js -i bomresults/bom-dotnet-fs-research.json -o bomresults/bom-dotnet-fs-research.evinse.json -l "f#" --profile research repotests/dotnet-language-smoke/fsapp

          node --input-type=module <<'EOF'
          import { existsSync, readFileSync } from "node:fs";
          import { join } from "node:path";

          import { resolveCdxgenPlugins } from "./lib/inventory/plugins.js";
          import { validateBom } from "./lib/validator/bomValidator.js";

          // dosai ships in the optional plugins-bin package, so its evidence can
          // only be asserted when the binary resolved for this platform.
          const { pluginsDir } = resolveCdxgenPlugins();
          const hasDosai =
            Boolean(pluginsDir) && existsSync(join(pluginsDir, "dosai"));

          for (const [language, bomFile, evinseFile] of [
            [
              "vb",
              "bomresults/bom-dotnet-vb-research.json",
              "bomresults/bom-dotnet-vb-research.evinse.json",
            ],
            [
              "fsharp",
              "bomresults/bom-dotnet-fs-research.json",
              "bomresults/bom-dotnet-fs-research.evinse.json",
            ],
          ]) {
            for (const file of [bomFile, evinseFile]) {
              const bom = JSON.parse(readFileSync(file, "utf-8"));
              const components = bom.components || [];
              const occurrenceComponents = components.filter(
                (component) =>
                  (component.evidence?.occurrences || []).length > 0,
              );
              const cryptoAssets = components.filter(
                (component) => component.type === "cryptographic-asset",
              );
              const dosaiTool = bom.metadata?.tools?.components?.some(
                (component) => component.name === "dosai",
              );
              const newtonsoft = components.find((component) =>
                component.purl?.startsWith("pkg:nuget/Newtonsoft.Json@"),
              );
              const dllOccurrences = occurrenceComponents.flatMap((component) =>
                (component.evidence?.occurrences || []).filter((occurrence) =>
                  String(occurrence.location || "")
                    .toLowerCase()
                    .endsWith(".dll"),
                ),
              );
              if (!validateBom(bom)) {
                throw new Error(`${language} ${file} is not schema-valid`);
              }
              if (hasDosai && !dosaiTool) {
                throw new Error(`${language} ${file} missing dosai tool metadata`);
              }
              if (!newtonsoft) {
                throw new Error(`${language} ${file} missing Newtonsoft.Json`);
              }
              if (hasDosai && !occurrenceComponents.length) {
                throw new Error(`${language} ${file} missing occurrence evidence`);
              }
              if (hasDosai && !cryptoAssets.length) {
                throw new Error(`${language} ${file} missing crypto assets`);
              }
              if (dllOccurrences.length) {
                throw new Error(`${language} ${file} has DLL occurrences`);
              }
              if (cryptoAssets.some((component) => component.purl)) {
                throw new Error(`${language} ${file} crypto asset has purl`);
              }
              console.log(
                JSON.stringify({
                  language,
                  file,
                  components: components.length,
                  occurrenceComponents: occurrenceComponents.length,
                  cryptoAssets: cryptoAssets.length,
                }),
              );
            }
          }
          EOF
          rm -rf repotests/dotnet-language-smoke || true
        shell: bash

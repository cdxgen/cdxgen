name: Repo tests

on:
  pull_request:
    paths:
      - '.github/workflows/repotests.yml'
      - 'ci/assertions.sh'
      - 'ci/introspection-tests.sh'
      - '.nvmrc'
      - '.pnpmfile.cjs'
      - 'bin/**'
      - 'data/**'
      - 'index.cjs'
      - 'lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'test/data/atom-exclude-repotest/**'
      - 'test/data/introspection-polyglot/**'
      - 'test/data/angular-cli-scripts-repotest/**'
      - 'test/data/angular-css-config-repotest/**'
      - 'test/data/angular-template-repotest/**'
      - 'test/data/svelte-repotest/**'
      - 'test/data/svelte-legacy-repotest/**'
      - 'test/data/svelte-precision/**'
      - 'test/data/cargo-cache-fixture/**'
      - 'test/data/cache-disable-repotest/**'
      - 'test/data/cbom-js-repotest/**'
      - 'test/data/cargo-workspace-repotest/**'
      - 'test/data/evinse-php-repotest/**'
      - 'test/data/evinse-cpp-repotest/**'
      - 'test/data/evinse-python-repotest/**'
      - 'test/data/go-dataflow-repotest/**'
      - 'test/data/rust-dataflow-repotest/**'
      - 'test/data/gguf-ai-repotest/**'
      - 'test/data/maven-optional-repotest/**'
      - 'test/data/mcp-repotest/**'
      - 'test/data/npm-hidden-lockfile-repotest/**'
      - 'test/data/pixi-workspace-repotest/**'
      - 'test/data/type-only-repotest/**'
      - 'test/data/unused-runtime-dep-repotest/**'
      - 'test/repotests/introspect-*/**'
      - '!**.poku.js'
  # Release branches run the full suite unconditionally — no path filter. The
  # v13 purl work showed that failures surface from data files and generated
  # output as much as from lib/, so a path-filtered run can pass while the
  # release is broken.
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXUS_URL: ${{ secrets.NEXUS_URL }}

# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: {}

# Pull-request labels can narrow this suite (they only apply to pull_request
# events; push and workflow_dispatch runs are unaffected). A run reads the
# labels the pull request has when it starts, and adding or removing one does
# not start a run, so a label takes effect from the next push:
#   ci:skip-repotests  - skip every job in this workflow. For changes that
#                        cannot affect these tests (docs, CI-only edits) while
#                        a pull request is iterating.
#   ci:skip-windows    - drop the windows legs. Windows is
#                        the slowest leg by far; label a PR when the change is
#                        unix-only and the windows coverage can wait for the
#                        merge commit's release-branch run.
jobs:
  cli-tests-quick-amd64:
    runs-on: ["self-hosted", "ubuntu", "amd64"]
    timeout-minutes: 90
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip-repotests') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.0'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: 'hoolicorp/java-sec-code'
          path: 'repotests/java-sec-code'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: 'rtfeldman/elm-spa-example'
          path: 'repotests/elm-spa-example'
      - name: Trim CI agent
        run: |
          rm -rf /tmp/docker-images-* /tmp/atom-usages-* /tmp/atom-reachables-* /tmp/cdx*
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: pnpm install
        run: |
          pnpm install:frozen
          mkdir -p bomresults
          rm -rf $CDXGEN_TEMP_DIR && mkdir -p $CDXGEN_TEMP_DIR
        env:
          CI: true
          CDXGEN_TEMP_DIR: ${{ runner.temp }}/cdxgen-repotests
      - name: repotests java-sec-code
        run: |
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-1.json --include-formulation --include-crypto --fail-on-error
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-1.spdx.json --format spdx --fail-on-error
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-2.json --author foo --author bar --standard asvs-4.0.3
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-3.json --required-only --fail-on-error
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-4.json --filter postgres --filter json
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-5.json --only spring --fail-on-error
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-6.json --deep --evidence
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-7.json --profile research --spec-version 1.6 --export-proto --proto-bin-file bomresults/bom-java-sec-code-7.cdx
          node bin/convert.js -i bomresults/bom-java-sec-code-7.json -o bomresults/bom-java-sec-code-7.spdx.json
          node bin/convert.js -i bomresults/bom-java-sec-code-7.cdx -o bomresults/bom-java-sec-code-7.proto.spdx.json
          bin/validate.js -i bomresults/bom-java-sec-code-7.cdx --fail-severity critical --no-deep --report json > bomresults/bom-java-sec-code-7.validate.json
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-11.json --spec-version 1.7 --export-proto --proto-bin-file bomresults/bom-java-sec-code-11.cdx --fail-on-error
          node bin/convert.js -i bomresults/bom-java-sec-code-11.json -o bomresults/bom-java-sec-code-11.spdx.json
          node bin/convert.js -i bomresults/bom-java-sec-code-11.cdx -o bomresults/bom-java-sec-code-11.proto.spdx.json
          bin/validate.js -i bomresults/bom-java-sec-code-11.cdx --fail-severity critical --no-deep --report json > bomresults/bom-java-sec-code-11.validate.json
          ls -lh bomresults
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-8.json --profile license-compliance
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-9.json --include-regex "pom.xml" --bom-audit
          bin/cdxgen.js -t java -t github repotests/java-sec-code -o bomresults/bom-java-sec-code-9.json
          bin/cdxgen.js -t java -exclude-type js repotests/java-sec-code -o bomresults/bom-java-sec-code-10.json
          bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-release-notes.json --include-release-notes --release-notes-current-tag v1.0.0 --release-notes-previous-tag v0.9.0 --fail-on-error
          jq -e 'any(.metadata.tools.components[]; .group == "@cdxgen" and .name == "cdxgen" and (.releaseNotes.type != null) and (.releaseNotes.title != null) and (.releaseNotes.description != null) and (.releaseNotes.timestamp != null) and ((.releaseNotes.tags | length) >= 1) and (.releaseNotes.resolves | type == "array"))' bomresults/bom-java-sec-code-release-notes.json
          bin/cdxgen.js -t java https://github.com/HooliCorp/java-sec-code.git -o bomresults/bom-java-sec-code-git-url.json --git-branch master --fail-on-error --bom-audit
          bin/cdxgen.js -t js "pkg:npm/lodash@4.17.21" -o bomresults/bom-lodash-purl.json --fail-on-error
          bin/cdxgen.js -t java test/data/maven-optional-repotest -o bomresults/bom-maven-optional-fixture.json --fail-on-error
          jq -e 'any(.components[]; .purl == "pkg:maven/org.apache.maven/maven-artifact@3.9.9?type=jar" and .scope == "optional")' bomresults/bom-maven-optional-fixture.json
          jq -e 'any(.dependencies[]; .ref == "pkg:maven/example/maven-optional-repotest@1.0.0?type=jar" and (.dependsOn | index("pkg:maven/org.apache.maven/maven-artifact@3.9.9?type=jar")))' bomresults/bom-maven-optional-fixture.json
          bin/validate.js -i bomresults/bom-java-sec-code-10.json --format console --fail-severity critical
        shell: bash
        env:
          NPM_URL: ${{ env.NEXUS_URL }}
      - name: repotests java-sec-code (allow lists)
        run: |
          CDXGEN_ALLOWED_COMMANDS=none CDXGEN_ALLOWED_HOSTS=localhost bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-1.json
          CDXGEN_ALLOWED_COMMANDS=mvn CDXGEN_ALLOWED_HOSTS="*.maven.org,*.github.com" bin/cdxgen.js -t java repotests/java-sec-code -o bomresults/bom-java-sec-code-2.json --fail-on-error
        shell: bash
        env:
          FETCH_LICENSE: true
          CDXGEN_TRACE_ID: foo
          CDXGEN_DEBUG_MODE: debug
      - name: repotests cargo fixture
        run: |
          bin/cdxgen.js -t cargo -t github test/data/cargo-workspace-repotest -o bomresults/bom-cargo-workspace-fixture.json --include-formulation --bom-audit
          jq -e 'any(.components[]; .name == "core" and any((.properties // [])[]; .name == "cdx:cargo:workspaceDependencyResolved" and .value == "true"))' bomresults/bom-cargo-workspace-fixture.json
          jq -e 'any(.components[]; .name == "build-helper" and any((.properties // [])[]; .name == "cdx:cargo:dependencyKind" and .value == "build") and any((.properties // [])[]; .name == "cdx:cargo:resolvedWorkspaceMember" and .value == "build-helper"))' bomresults/bom-cargo-workspace-fixture.json
          jq -e 'any(.components[]; any((.properties // [])[]; .name == "cdx:github:action:ecosystem" and .value == "cargo") and any((.properties // [])[]; .name == "cdx:github:action:role" and .value == "toolchain"))' bomresults/bom-cargo-workspace-fixture.json
          jq -e 'any(.components[]; any((.properties // [])[]; .name == "cdx:github:step:usesCargo" and .value == "true") and any((.properties // [])[]; .name == "cdx:github:step:cargoSubcommands" and .value == "build,test"))' bomresults/bom-cargo-workspace-fixture.json
          jq -e 'any(.annotations[]?; (.text // "") | contains("INT-012"))' bomresults/bom-cargo-workspace-fixture.json
          jq -e 'any(.annotations[]?; (.text // "") | contains("INT-013"))' bomresults/bom-cargo-workspace-fixture.json
          CARGO_CACHE_DIR=test/data/cargo-cache-fixture/registry/cache/index.crates.io-1949cf8c6b5b557f bin/cdxgen.js -t cargo-cache . -o bomresults/bom-cargo-cache-fixture.json --fail-on-error
          jq -e 'any(.components[]; .name == "serde" and any((.properties // [])[]; .name == "cdx:cargo:cacheSource" and .value == "registry-cache"))' bomresults/bom-cargo-cache-fixture.json
        shell: bash
      - name: repotests elm-spa-example
        run: |
          bin/cdxgen.js -t elm repotests/elm-spa-example -o bomresults/bom-elm-spa-example.json --fail-on-error
          jq -e '(.components | length) >= 10' bomresults/bom-elm-spa-example.json
          jq -e 'any(.components[]; .name == "http" and .group == "elm" and (.purl | startswith("pkg:generic/elm/http@")) and any((.properties // [])[]; .name == "cdx:elm:dependency" and .value == "direct") and any((.properties // [])[]; .name == "cdx:purl:proposedType" and .value == "elm"))' bomresults/bom-elm-spa-example.json
          jq -e 'any(.metadata.component.properties[]?; .name == "cdx:elm:elmVersion")' bomresults/bom-elm-spa-example.json
          jq -e 'any(.components[]; .scope == "optional" and any((.properties // [])[]; .name == "cdx:elm:dependency" and (.value == "direct-test" or .value == "indirect-test")))' bomresults/bom-elm-spa-example.json
        shell: bash
      - name: repotests source crypto fixture
        run: |
          bin/cdxgen.js test/data/cbom-js-repotest -o bomresults/bom-cbom-js-fixture.json --include-crypto --evidence --deep --spec-version 1.7 --fail-on-error
          bin/cdxgen.js test/data/cbom-js-repotest -o bomresults/bom-cbom-js-fixture.proto.json --include-crypto --evidence --deep --spec-version 1.7 --export-proto --proto-bin-file bomresults/bom-cbom-js-fixture.cdx --fail-on-error
          bin/cdxgen.js test/data/cbom-js-repotest -o bomresults/bom-cbom-js-fixture-libraries.json --include-crypto --evidence --deep --spec-version 1.7 --component-type library --fail-on-error
          bin/cdxgen.js -t js test/data/atom-exclude-repotest -o bomresults/bom-atom-exclude-fixture.json --profile research --exclude "**/ignored/**" --fail-on-error
          node bin/convert.js -i bomresults/bom-cbom-js-fixture.cdx -o bomresults/bom-cbom-js-fixture.proto.spdx.json
          bin/validate.js -i bomresults/bom-cbom-js-fixture.cdx --fail-severity critical --no-deep --report json > bomresults/bom-cbom-js-fixture.validate.json
          jq -e 'all(.components[]?; .type == "library")' bomresults/bom-cbom-js-fixture-libraries.json
          jq -e 'any(.components[]; .type == "cryptographic-asset" and .name == "sha-512" and .cryptoProperties.assetType == "algorithm" and .cryptoProperties.oid == "2.16.840.1.101.3.4.2.3")' bomresults/bom-cbom-js-fixture.json
          jq -e 'all(.components[]? | select(.type == "cryptographic-asset"); .purl == null)' bomresults/bom-cbom-js-fixture.proto.json
          jq -e 'any(.components[]; .type == "cryptographic-asset" and .name == "aes256-GCM" and any((.properties // [])[]; .name == "cdx:crypto:sourceType" and .value == "js-ast:webcrypto.generateKey"))' bomresults/bom-cbom-js-fixture.json
          jq -e 'any(.components[]; .type == "cryptographic-asset" and .name == "sha-384" and any((.properties // [])[]; .name == "cdx:crypto:sourceLocation" and .value == "dynamic-branches.mjs:12:0") and any((.evidence.occurrences // [])[]; .location == "dynamic-branches.mjs" and .line == 12 and .symbol == "node:crypto.createHash" and .additionalContext == "hash" and (.offset? == null)))' bomresults/bom-cbom-js-fixture.json
          jq -e 'any(.components[]; .type == "cryptographic-asset" and .name == "sha-384" and any((.properties // [])[]; .name == "cdx:crypto:sourceType" and .value == "js-ast:node:crypto.sign") and any((.evidence.occurrences // [])[]; .location == "dynamic-branches.mjs" and .symbol == "node:crypto.sign" and .additionalContext == "signature" and (.offset? == null)))' bomresults/bom-cbom-js-fixture.json
          jq -e 'any(.components[]; .type == "cryptographic-asset" and .name == "sha-256" and any((.properties // [])[]; .name == "cdx:crypto:sourceType" and .value == "js-ast:node:crypto.sign") and any((.evidence.occurrences // [])[]; .location == "dynamic-branches.mjs" and .symbol == "node:crypto.sign" and .additionalContext == "signature" and (.offset? == null)))' bomresults/bom-cbom-js-fixture.json
          jq -e 'any(.components[]; .type == "cryptographic-asset" and .name == "sha256WithRSAEncryption" and any((.properties // [])[]; .name == "cdx:crypto:sourceType" and .value == "js-ast:jsonwebtoken.sign"))' bomresults/bom-cbom-js-fixture.json
          jq -e 'any(.components[]; .type == "cryptographic-asset" and .name == "sha512WithRSAEncryption" and any((.properties // [])[]; .name == "cdx:crypto:sourceType" and .value == "js-ast:jsonwebtoken.sign"))' bomresults/bom-cbom-js-fixture.json
          jq -e 'any(.components[]; .type == "cryptographic-asset" and .name == "aes256-CBC" and any((.properties // [])[]; .name == "cdx:crypto:sourceType" and .value == "js-ast:webcrypto.generateKey"))' bomresults/bom-cbom-js-fixture.json
          jq -e 'any(.components[]; .type == "cryptographic-asset" and .name == "sha-512" and any((.evidence.occurrences // [])[]; .location == "dynamic-branches.mjs" and .line == 40 and .symbol == "node:crypto.sign" and .additionalContext == "signature" and (.offset? == null)))' bomresults/bom-cbom-js-fixture.json
          jq -e 'any(.components[]; .type == "cryptographic-asset" and .name == "sha-384" and any((.evidence.occurrences // [])[]; .location == "dynamic-branches.mjs" and .line == 62 and .symbol == "node:crypto.sign" and .additionalContext == "signature" and (.offset? == null)))' bomresults/bom-cbom-js-fixture.json
          jq -e 'all(.components[]? | select(.type == "cryptographic-asset" and .cryptoProperties.assetType == "algorithm"); .cryptoProperties.oid != null)' bomresults/bom-cbom-js-fixture.json
          jq -e 'any(.components[]; ((.purl // "") | startswith("pkg:npm/left-pad@1.3.0")) and any((.evidence.occurrences // [])[]; (.location // "") | contains("src/used/index.js")))' bomresults/bom-atom-exclude-fixture.json
          jq -e 'all(.components[]?; all((.evidence.occurrences // [])[]?; (((.location // "") | contains("ignored")) | not)))' bomresults/bom-atom-exclude-fixture.json
          jq -e 'all(.components[]? | select((.purl // "") | startswith("pkg:npm/is-odd@3.0.1")); ((.evidence.occurrences // []) | length) == 0)' bomresults/bom-atom-exclude-fixture.json
          bin/cdxgen.js -t js test/data/type-only-repotest -o bomresults/bom-type-only-fixture.json --fail-on-error
          jq -e 'any(.components[]; .name == "is-odd" and .scope == "excluded" and any((.properties // [])[]; .name == "cdx:npm:package:type-only" and .value == "true"))' bomresults/bom-type-only-fixture.json
          jq -e 'any(.components[]; .name == "is-even" and .scope == "required")' bomresults/bom-type-only-fixture.json
          jq -e 'any(.components[]; .name == "is-number" and .scope == "optional")' bomresults/bom-type-only-fixture.json
        shell: bash
      - name: repotests gguf ai fixture
        run: |
          node test/data/gguf-ai-repotest/write-gguf-fixtures.mjs
          bin/cdxgen.js -t ai test/data/gguf-ai-repotest -o bomresults/bom-gguf-ai-fixture.json --include-formulation --fail-on-error
          jq -e 'any(.components[]; .type == "machine-learning-model" and .name == "Mixtral-8x7B-Instruct" and .version == "v0.1" and any((.properties // [])[]; .name == "cdx:ai:artifactFormat" and .value == "gguf") and any((.properties // [])[]; .name == "cdx:ai:quantization" and .value == "Q5_K_M") and any((.properties // [])[]; .name == "cdx:gguf:sizeLabel" and .value == "8x7B") and any((.properties // [])[]; .name == "cdx:gguf:tokenizerModel" and .value == "llama") and any((.properties // [])[]; .name == "cdx:gguf:tokenizerTokenCount" and .value == "4") and any((.properties // [])[]; .name == "cdx:gguf:chatTemplateDetected" and .value == "true") and .modelCard.modelParameters.architectureFamily == "llama" and .modelCard.modelParameters.task == "text-generation" and .modelCard.modelParameters.datasets[0].contents.url == "https://huggingface.co/datasets/mistralai/mixtral-pretrain" and .modelCard.modelParameters.inputs[0].format == "text" and .modelCard.modelParameters.outputs[0].format == "text" and .pedigree.ancestors[0].purl == "pkg:huggingface/mistralai/Mistral-7B-Instruct-v0.2" and any((.externalReferences // [])[]; .type == "vcs" and .url == "https://huggingface.co/mistralai/Mixtral-8x7B-Instruct-v0.1"))' bomresults/bom-gguf-ai-fixture.json
          jq -e 'any(.components[]; .type == "file" and .name == "Mixtral-8x7B-Instruct-v0.1-Q5_K_M-00001-of-00002.gguf" and any((.properties // [])[]; .name == "cdx:gguf:shard" and .value == "00001-of-00002") and any((.properties // [])[]; .name == "cdx:gguf:alignment" and .value == "64") and any((.properties // [])[]; .name == "cdx:gguf:huggingFaceTokenizer" and .value == "true"))' bomresults/bom-gguf-ai-fixture.json
        shell: bash
      - name: repotests local huggingface ai fixture
        run: |
          bin/cdxgen.js -t ai test/data/ai-huggingface/repos -o bomresults/bom-huggingface-ai-fixture.json --include-formulation --fail-on-error
          jq -e 'any(.components[]; .type == "machine-learning-model" and .group == "HuggingFaceH4" and .name == "zephyr-7b-beta" and any((.modelCard.properties // [])[]; .name == "cdx:huggingface:language" and .value == "en") and any((.modelCard.properties // [])[]; .name == "cdx:huggingface:gatedFieldCount" and .value == "1") and .modelCard.modelParameters.inputs[0].format == "text" and .modelCard.modelParameters.outputs[0].format == "text" and any((.modelCard.considerations.environmentalConsiderations.properties // [])[]; .name == "cdx:huggingface:co2EmissionsGrams" and .value == "123.4") and any((.pedigree.ancestors // [])[]; .group == "mistralai"))' bomresults/bom-huggingface-ai-fixture.json
          jq -e 'any(.dependencies[]; .ref == "pkg:huggingface/HuggingFaceH4/zephyr-7b-beta" and any((.dependsOn // [])[]; . == "pkg:huggingface/HuggingFaceH4/ultrachat_200k?repository_url=https:%2F%2Fhuggingface.co%2Fdatasets"))' bomresults/bom-huggingface-ai-fixture.json
        shell: bash
      - name: repotests angular analyzer fixtures
        run: |
          bin/cdxgen.js -t js test/data/angular-css-config-repotest -o bomresults/bom-angular-css-config-fixture.json --deep --evidence --fail-on-error
          bin/cdxgen.js -t js test/data/angular-template-repotest -o bomresults/bom-angular-template-fixture.json --deep --evidence --fail-on-error
          bin/cdxgen.js -t js test/data/angular-cli-scripts-repotest -o bomresults/bom-angular-cli-scripts-fixture.json --deep --evidence --fail-on-error
          jq -e 'any(.components[]; .purl == "pkg:npm/material-symbols@0.28.2" and .scope == "required")' bomresults/bom-angular-css-config-fixture.json
          jq -e 'any(.components[]; .purl == "pkg:npm/bootstrap@5.3.3" and .scope == "required")' bomresults/bom-angular-css-config-fixture.json
          jq -e 'any(.components[]; .purl == "pkg:npm/angular-i18n@1.8.3" and .scope == "required")' bomresults/bom-angular-css-config-fixture.json
          jq -e 'any(.components[]; .purl == "pkg:npm/left-pad@1.3.0" and (.scope // "required") == "required")' bomresults/bom-angular-css-config-fixture.json
          jq -e 'any(.components[]; .purl == "pkg:npm/material-symbols@0.28.2" and .scope == "required")' bomresults/bom-angular-template-fixture.json
          jq -e 'any(.components[]; .purl == "pkg:npm/primeicons@7.0.0" and .scope == "required")' bomresults/bom-angular-template-fixture.json
          jq -e 'any(.components[]; .purl == "pkg:npm/bootstrap-icons@1.11.3" and .scope == "required")' bomresults/bom-angular-template-fixture.json
          jq -e 'any(.components[]; .group == "@fortawesome" and .name == "fontawesome-free" and .scope == "required")' bomresults/bom-angular-template-fixture.json
          jq -e 'any(.components[]; .purl == "pkg:npm/left-pad@1.3.0" and (.scope // "required") == "required")' bomresults/bom-angular-template-fixture.json
          jq -e 'any(.components[]; .purl == "pkg:npm/license-report@6.5.0" and .scope == "required" and any((.properties // [])[]; .name == "cdx:npm:bin" and (.value | contains("license-report"))))' bomresults/bom-angular-cli-scripts-fixture.json
          jq -e 'any(.components[]; .group == "@angular" and .name == "cli" and .scope == "required")' bomresults/bom-angular-cli-scripts-fixture.json
          jq -e 'any(.components[]; .purl == "pkg:npm/left-pad@1.3.0" and (.scope // "required") == "required")' bomresults/bom-angular-cli-scripts-fixture.json
        shell: bash
      - name: repotests npm unused runtime dependency fixture
        run: |
          bin/cdxgen.js -t js test/data/unused-runtime-dep-repotest -o bomresults/bom-unused-runtime-dep-fixture.json --fail-on-error
          bin/cdxgen.js -t js test/data/unused-runtime-dep-repotest -o bomresults/bom-unused-runtime-dep-required-fixture.json --required-only --fail-on-error
          jq -e 'any(.components[]; .purl == "pkg:npm/left-pad@1.3.0" and .scope == null)' bomresults/bom-unused-runtime-dep-fixture.json
          jq -e 'any(.components[]; .purl == "pkg:npm/ms@2.1.3" and .scope == "required")' bomresults/bom-unused-runtime-dep-fixture.json
          jq -e 'any(.components[]; .purl == "pkg:npm/is-number@7.0.0" and .scope == "required" and any((.properties // [])[]; .name == "cdx:npm:package:development" and .value == "true"))' bomresults/bom-unused-runtime-dep-fixture.json
          jq -e 'any(.components[]; .purl == "pkg:npm/picocolors@1.1.1" and .scope == "optional")' bomresults/bom-unused-runtime-dep-fixture.json
          jq -e '[.components[].purl] | (index("pkg:npm/left-pad@1.3.0") != null) and (index("pkg:npm/ms@2.1.3") != null) and (index("pkg:npm/picocolors@1.1.1") == null)' bomresults/bom-unused-runtime-dep-required-fixture.json
        shell: bash
      - name: repotests semver build metadata fixtures
        run: |
          # A version such as 1.0.0+root must reach the purl escaped once (%2B),
          # pass validation, and carry the version npm publish would record.
          for pm in npm pnpm yarn yarn-classic bun; do
            bom="bomresults/bom-${pm}-build-metadata.json"
            bin/cdxgen.js -t js "test/repotests/${pm}-build-metadata-smoke" -o "$bom" --no-recurse --fail-on-error
            jq -e --arg pm "$pm" '.metadata.component.purl == ("pkg:npm/" + $pm + "-build-metadata@1.0.0%2Broot") and any(.metadata.component.properties[]?; .name == "cdx:npm:cleanedVersion" and .value == "1.0.0")' "$bom"
            jq -e 'any(.components[], (.metadata.component.components // [])[]; .purl == "pkg:npm/wsmember@3.0.0%2Bws" and .version == "3.0.0+ws" and any(.properties[]?; .name == "cdx:npm:cleanedVersion" and .value == "3.0.0"))' "$bom"
            jq -e '[.. | objects | .purl? // empty | select(contains("%25"))] | length == 0' "$bom"
            # Every package manager links the workspace members from the root,
            # and every dependsOn ref names a component in the BOM.
            jq -e '.metadata.component["bom-ref"] as $root | any(.dependencies[]; .ref == $root and (.dependsOn | index("pkg:npm/wsmember@3.0.0+ws")) and (.dependsOn | index("pkg:npm/@acme/tools@0.9.0+exp.sha.5114f85")))' "$bom"
            jq -e '([.components[]?, .metadata.component, (.metadata.component.components // [])[]] | map(."bom-ref")) as $refs | [.dependencies[].dependsOn[]?] | unique | all(. as $r | $refs | index($r))' "$bom"
          done
        shell: bash
      - name: repotests npm hidden lockfile fixture
        run: |
          cd test/data/npm-hidden-lockfile-repotest && npm ci
          node ../../../bin/cdxgen.js -t js . -o ../../../bomresults/bom-npm-hidden-lockfile-fixture.json --deep --no-install-deps --no-babel --no-banner --fail-on-error
          cd "$GITHUB_WORKSPACE"
          jq -e '(.components | length) == 1' bomresults/bom-npm-hidden-lockfile-fixture.json
          jq -e 'any(.components[]; .purl == "pkg:npm/is-number@7.0.0" and .description == "Returns true if a number or string value is a finite number. Useful for regex matches, parsing, user input, etc." and any((.licenses // [])[]; (.license.id // .license.name // "") == "MIT") and any((.tags // [])[]; . == "numeric") and any((.externalReferences // [])[]; .type == "issue-tracker" and .url == "https://github.com/jonschlinkert/is-number/issues"))' bomresults/bom-npm-hidden-lockfile-fixture.json
        shell: bash
      - name: repotests cdxgen self source crypto
        run: |
          node --input-type=module <<'EOF'
          import { writeFileSync } from "node:fs";

          import { collectSourceCryptoComponents } from "./lib/inventory/cbomutils.js";

          const targets = [
            "./lib/helpers",
            "./bin",
            "./lib/audit",
            "./lib/stages",
            "./lib/server",
            "./lib/managers",
            "./lib/evinser",
            "./lib/parsers",
          ];
          const expectedNonEmptyTargets = new Set([
            "./lib/helpers",
            "./bin",
            "./lib/audit",
            "./lib/managers",
            "./lib/stages",
          ]);
          const inventory = {};
          for (const target of targets) {
            const components = await collectSourceCryptoComponents(target, {
              deep: false,
              evidence: true,
              specVersion: 1.7,
            });
            if (expectedNonEmptyTargets.has(target) && !components.length) {
              throw new Error(`Expected source-derived crypto components for ${target}`);
            }
            if (!expectedNonEmptyTargets.has(target) && components.length) {
              throw new Error(
                `Expected no source-derived crypto components for ${target}, found ${components.length}`,
              );
            }
            inventory[target] = components;
          }
          writeFileSync(
            "bomresults/bom-cdxgen-self-source-cbom.json",
            JSON.stringify(inventory, null, 2),
          );
          EOF
          jq -e 'any(.["./lib/audit"][]; .type == "cryptographic-asset" and .name == "sha-256" and .cryptoProperties.assetType == "algorithm" and any((.properties // [])[]; .name == "cdx:crypto:sourceType" and .value == "js-ast:node:crypto.createHash") and ((.evidence.identity // []) | length) > 0 and .evidence.identity[0].field == "name" and ((.evidence.identity[0].methods // []) | length) > 0 and ((.evidence.occurrences // []) | length) > 0)' bomresults/bom-cdxgen-self-source-cbom.json
          jq -e '([.["./lib/helpers"][], .["./bin"][], .["./lib/audit"][], .["./lib/managers"][]]) | all(.[]?; .type != "cryptographic-asset" or ((.cryptoProperties.assetType // "") != "algorithm") or (all((.evidence.occurrences // [])[]?; .location != null and (.line? == null or (.line | type == "number")) and (.offset? == null))))' bomresults/bom-cdxgen-self-source-cbom.json
          jq -e '([.["./lib/helpers"][], .["./bin"][], .["./lib/audit"][], .["./lib/managers"][]]) | all(.[]?; .type != "cryptographic-asset" or ((.cryptoProperties.assetType // "") != "algorithm") or ((((.evidence.identity // []) | length) > 0) and (((.evidence.occurrences // []) | length) > 0)))' bomresults/bom-cdxgen-self-source-cbom.json
          jq -e '((.["./bin"] | length) > 0) and ((.["./lib/audit"] | length) > 0) and ((.["./lib/managers"] | length) > 0)' bomresults/bom-cdxgen-self-source-cbom.json
          jq -e '((.["./lib/server"] | length) == 0) and ((.["./lib/evinser"] | length) == 0) and ((.["./lib/parsers"] | length) == 0)' bomresults/bom-cdxgen-self-source-cbom.json
          jq -e 'any(.["./lib/stages"][]; .type == "cryptographic-asset" and .name == "sha-256" and .cryptoProperties.assetType == "algorithm")' bomresults/bom-cdxgen-self-source-cbom.json
        shell: bash
      - name: repotests cache-disable fixture
        run: |
          bin/cdxgen.js -t js -t python -t cargo -t github test/data/cache-disable-repotest -o bomresults/bom-cache-disable-fixture.json --bom-audit --bom-audit-categories ci-permission --fail-on-error
          jq -e 'any(.components[]; .purl == "pkg:github/actions/setup-node@v4" and any((.properties // [])[]; .name == "cdx:github:action:disablesBuildCache" and .value == "true"))' bomresults/bom-cache-disable-fixture.json
          jq -e 'any(.components[]; .purl == "pkg:github/actions/setup-python@v5" and any((.properties // [])[]; .name == "cdx:github:action:disablesBuildCache" and .value == "true"))' bomresults/bom-cache-disable-fixture.json
          jq -e 'any(.components[]; .purl == "pkg:github/moonrepo/setup-rust@v1" and any((.properties // [])[]; .name == "cdx:github:action:buildCacheEcosystem" and .value == "cargo"))' bomresults/bom-cache-disable-fixture.json
          jq -e 'any(.components[]; .purl == "pkg:npm/left-pad@1.3.0" and any((.properties // [])[]; .name == "cdx:npm:manifestSourceType" and .value == "url"))' bomresults/bom-cache-disable-fixture.json
          jq -e 'any(.components[]; .purl == "pkg:pypi/anyio@4.6.0" and any((.properties // [])[]; .name == "cdx:pypi:manifestSourceType" and .value == "url"))' bomresults/bom-cache-disable-fixture.json
          jq -e 'any(.components[]; .name == "git-crate" and any((.properties // [])[]; .name == "cdx:cargo:git" and .value == "https://github.com/acme/git-crate.git"))' bomresults/bom-cache-disable-fixture.json
          jq -e 'any(.annotations[]?; (.text // "") | contains("CI-022"))' bomresults/bom-cache-disable-fixture.json
          jq -e 'any(.annotations[]?; (.text // "") | contains("CI-023"))' bomresults/bom-cache-disable-fixture.json
          jq -e 'any(.annotations[]?; (.text // "") | contains("CI-024"))' bomresults/bom-cache-disable-fixture.json
        shell: bash
      - name: repotests cargo dry-run fixture
        run: |
          bin/cdxgen.js --dry-run -t cargo -t github test/data/cargo-workspace-repotest --no-banner
          bin/cdxgen.js --dry-run -t js test/data/yarn-workspaces-same-version-demo --no-banner
          printf 'test-private-key' > /tmp/cdxgen-dry-run-signing.key
          SBOM_SIGN_ALGORITHM=RS512 SBOM_SIGN_PRIVATE_KEY=/tmp/cdxgen-dry-run-signing.key bin/cdxgen.js --dry-run -t js test/data/dry-run-private-registry-repotest --no-banner
          mkdir -p /tmp/cdxgen-docker-config
          cat <<'JSON' > /tmp/cdxgen-docker-config/config.json
          {
            "credHelpers": {
              "docker.io": "osxkeychain"
            }
          }
          JSON
          DOCKER_CONFIG=/tmp/cdxgen-docker-config bin/cdxgen.js --dry-run -t oci docker.io/library/alpine:3.20 --no-banner
          bin/cdxgen.js --dry-run -t js "pkg:npm/lodash@4.17.21" --no-banner
        shell: bash
      - name: repotests MCP fixture
        run: |
          bin/cdxgen.js -t js test/data/mcp-repotest -o bomresults/bom-mcp-repotest.json --bom-audit --bom-audit-categories mcp-server --fail-on-error
          bin/cdxgen.js -t js -t mcp test/data/mcp-repotest -o bomresults/bom-mcp-research-proto.json --profile research --spec-version 1.6 --export-proto --proto-bin-file bomresults/bom-mcp-research-proto.cdx --fail-on-error
          node bin/convert.js -i bomresults/bom-mcp-research-proto.cdx -o bomresults/bom-mcp-research-proto.spdx.json
          bin/validate.js -i bomresults/bom-mcp-research-proto.cdx --fail-severity critical --no-deep --report json > bomresults/bom-mcp-research-proto.validate.json
          bin/cdxgen.js -t js test/data/mcp-repotest -o bomresults/bom-mcp-standards-proto.json --standard asvs-5.0 --spec-version 1.6 --export-proto --proto-bin-file bomresults/bom-mcp-standards-proto.cdx --fail-on-error
          node bin/convert.js -i bomresults/bom-mcp-standards-proto.cdx -o bomresults/bom-mcp-standards-proto.spdx.json
          bin/validate.js -i bomresults/bom-mcp-standards-proto.cdx --fail-severity critical --no-deep --report json > bomresults/bom-mcp-standards-proto.validate.json
          jq -e 'any(.services[]; .name == "auth-http-server" and .authenticated == true and any((.properties // [])[]; .name == "cdx:mcp:transport" and (.value | contains("streamable-http"))))' bomresults/bom-mcp-repotest.json
          jq -e 'any(.services[]; .name == "unsafe-http-server" and .authenticated == false and any((.properties // [])[]; .name == "cdx:mcp:officialSdk" and .value == "false"))' bomresults/bom-mcp-repotest.json
          jq -e 'any(.components[]; .name == "server" and any((.tags // [])[]; . == "official-mcp-sdk"))' bomresults/bom-mcp-repotest.json
          jq -e '(.services | length) >= 1 and .specVersion == "1.6"' bomresults/bom-mcp-research-proto.json
          jq -e '.specVersion == "1.6" and ((.definitions.standards | length) >= 1)' bomresults/bom-mcp-standards-proto.json
          jq -e 'any(.annotations[]?; (.text // "") | contains("MCP-001"))' bomresults/bom-mcp-repotest.json
          jq -e 'any(.annotations[]?; (.text // "") | contains("MCP-003"))' bomresults/bom-mcp-repotest.json
        shell: bash
      - name: repotests signed ASAR fixture
        run: |
          mkdir -p repotests/signed-asar/Signed.app/Contents/Resources
          curl -L --fail --silent --show-error https://raw.githubusercontent.com/electron/asar/8388dbd1ed7a290d05d1144ba833d895193d2cb3/test/expected/packthis.asar -o repotests/signed-asar/Signed.app/Contents/Resources/app.asar
          header_hash=$(node --input-type=module <<'EOF'
          import { createHash } from "node:crypto";
          import { readAsarArchiveHeaderSync } from "./lib/ecosystems/asarutils.js";

          const { headerString } = readAsarArchiveHeaderSync(
            "./repotests/signed-asar/Signed.app/Contents/Resources/app.asar",
          );
          console.log(
            createHash("sha256").update(headerString, "utf8").digest("hex"),
          );
          EOF
          )
          cat <<EOF > repotests/signed-asar/Signed.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>ElectronAsarIntegrity</key>
              <dict>
                <key>Resources/app.asar</key>
                <dict>
                  <key>algorithm</key>
                  <string>SHA256</string>
                  <key>hash</key>
                  <string>${header_hash}</string>
                </dict>
              </dict>
            </dict>
          </plist>
          EOF
          bin/cdxgen.js -t asar repotests/signed-asar/Signed.app/Contents/Resources/app.asar -o bomresults/bom-signed-asar.json --spec-version 1.7 --fail-on-error
          bin/validate.js -i bomresults/bom-signed-asar.json --report console --fail-severity critical
          jq -e 'any(.components[]; .type == "cryptographic-asset" and any((.properties // [])[]; .name == "cdx:asar:signingVerified" and .value == "true"))' bomresults/bom-signed-asar.json
          jq -e '([.metadata.component] + (.components // [])) | any(.[]; any((.properties // [])[]; .name == "cdx:file:kind" and .value == "asar-archive") and any((.properties // [])[]; .name == "cdx:asar:signingScope" and .value == "header-only"))' bomresults/bom-signed-asar.json
        shell: bash
  cli-tests-quick-arm64:
    runs-on: ["self-hosted", "ubuntu", "arm64"]
    timeout-minutes: 90
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip-repotests') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.0'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: 'aws-solutions/iot-device-simulator'
          path: 'repotests/iot-device-simulator'
          ref: 'v3.0.9'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: 'ollama/ollama'
          path: 'repotests/ollama'
          ref: 'v0.5.7'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: 'caddyserver/caddy'
          path: 'repotests/caddy'
          ref: 'v2.9.1'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: 'flutter/gallery'
          ref: 'v2.10.2'
          path: 'repotests/gallery'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: 'ShiftLeftSecurity/shiftleft-go-example'
          path: 'repotests/shiftleft-go-example'
      - name: Trim CI agent
        run: rm -rf /tmp/docker-images-* /tmp/atom-*  /tmp/mvn-deps*
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: pnpm install
        run: |
          pnpm install:frozen
          mkdir -p bomresults
          rm -rf $CDXGEN_TEMP_DIR && mkdir -p $CDXGEN_TEMP_DIR
        env:
          CI: true
          CDXGEN_TEMP_DIR: ${{ runner.temp }}/cdxgen-repotests
      - name: repotests iot-device-simulator
        run: |
          bin/cdxgen.js -t js -o bomresults/bom-iot.json repotests/iot-device-simulator --fail-on-error
          bin/cdxgen.js -t js -o bomresults/bom-iot16.json repotests/iot-device-simulator --spec-version 1.6 --fail-on-error
          node bin/convert.js -i bomresults/bom-iot16.json -o bomresults/bom-iot16.spdx.json
          bin/cdxgen.js -t js -o bomresults/bom-iot17.json repotests/iot-device-simulator --spec-version 1.7 --fail-on-error
          node bin/convert.js -i bomresults/bom-iot17.json -o bomresults/bom-iot17.spdx.json
          bin/cdxgen.js -t js -o bomresults/bom-iot-git-url.json --git-branch v3.0.9 https://github.com/aws-solutions/iot-device-simulator.git --fail-on-error
        shell: bash
      - name: repotests ollama
        run: |
          bin/cdxgen.js -r -t go repotests/ollama -o bomresults/bom-ollama.json --fail-on-error --bom-audit
          bin/cdxgen.js -r -t go repotests/caddy -o bomresults/bom-caddy.json --fail-on-error
        shell: bash
      - name: repotests go mod tests
        run: |
          mkdir -p gomod-example
          cd gomod-example
          curl -LO https://raw.githubusercontent.com/anchore/syft/main/go.mod
          cd "$GITHUB_WORKSPACE"
          bin/cdxgen.js -r -t go gomod-example -o bomresults/bom-gomod.json
        shell: bash
      - name: repotests shiftleft-go-example
        run: |
          FETCH_LICENSE=false bin/cdxgen.js -r -t golang repotests/shiftleft-go-example -o bomresults/bom-go.json --fail-on-error --spec-version 1.6 --export-proto
        shell: bash
      - name: repotests gallery
        run: |
          bin/cdxgen.js -r -t dart repotests/gallery -o bomresults/bom-pub.json --fail-on-error --bom-audit
          bin/validate.js -i bomresults/bom-pub.json -o bomresults/bom-pub.sarif --report sarif --fail-severity critical
          ls -l bomresults/bom-pub.sarif
        shell: bash
      - name: Cleanup
        run: rm -rf /tmp/docker-images-* /tmp/atom-*  /tmp/mvn-deps*
  cli-tests:
    strategy:
      fail-fast: false
      matrix:
        java-version: ['24']
        # The matrix context is not available to a job-level `if`, so the
        # ci:skip-windows label drops the windows leg from the matrix itself.
        os: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci:skip-windows') && '["self-hosted-ubuntu", "ubuntu-24.04-arm", "macos-15"]' || '["self-hosted-ubuntu", "ubuntu-24.04-arm", "windows-latest", "macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 210
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip-repotests') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.0'
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed  # v2.0.5
        with:
          deno-version: 2.9.6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Trim CI agent
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          chmod +x contrib/free_disk_space.sh
          ./contrib/free_disk_space.sh
      - uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7  # v1.5.11
      - name: Install bazelisk - linux

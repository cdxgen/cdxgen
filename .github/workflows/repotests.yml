          cd repotests/dotnet-language-smoke/fsapp
          dotnet add package Newtonsoft.Json --version 13.0.3
          cat > Program.fs <<'EOF'
          open System
          open System.Security.Cryptography
          open System.Text
          open Newtonsoft.Json

          type Payload = { Name: string; Language: string }

          [<EntryPoint>]
          let main _ =
              let payload = { Name = "cdxgen"; Language = "fsharp" }
              let json = JsonConvert.SerializeObject(payload)
              let digest = SHA256.HashData(Encoding.UTF8.GetBytes(json))

          rm -rf repotests/quarkus-quickstarts || true
        shell: bash
      - name: repotests evidence
        run: |
          # cdxgen's own BOM. Its evidence is not sliced here: by this step the
          # workspace also holds the repositories cloned above, and astgen's
          # type pass alone over cdxgen's largest modules outlasts atom's time
          # limit (cdxgen issue #4436).
          bin/cdxgen.js -t js --no-recurse -o bomresults/bom.json .
          # --evidence end to end, on a project atom slices in minutes. cdxgen
          # only warns when atom fails, and its own babel pass adds usage
          # evidence either way, so atom's usages slices are asserted directly.
          FETCH_LICENSE=false bin/cdxgen.js -t js --no-recurse -o bomresults/bom-ts-evidence.json --evidence --usages-slices-file bomresults/ts-usages.slices.json repotests/shiftleft-ts-example
          jq -e 'any(.components[]; .name == "express" and ((.evidence.occurrences // []) | length) > 0)' bomresults/bom-ts-evidence.json
          jq -e '[(.objectSlices // [])[] | select(.fullName and .fullName != "<empty>")] | length >= 20' bomresults/ts-usages.slices.json
        shell: bash

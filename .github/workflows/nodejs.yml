name: Node CI

on:
  pull_request:
    paths:
      - '.github/workflows/nodejs.yml'
      - '.nvmrc'
      - '.pnpmfile.cjs'
      - '.versions/node_*'
      - 'bin/**'
      - 'contrib/**'
      - 'data/**'
      - 'index.cjs'
      - 'lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'test/repotests/**'
      - 'devenv*'
  push:
    branches:
      - master
      - release/*
    tags:
      - 'v*'
    paths:
      - '.github/workflows/nodejs.yml'
      - '.nvmrc'
      - '.pnpmfile.cjs'
      - '.versions/node_*'
      - 'bin/**'
      - 'contrib/**'
      - 'data/**'
      - 'index.cjs'
      - 'lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'test/repotests/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: {}

jobs:
  read-node-versions:
    runs-on: 'ubuntu-latest'
    outputs:
      node-versions: ${{ steps.read-versions.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: read-versions
        run: |
          VERSIONS=[`awk 'BEGIN {ORS=""}; NR>2 && NR%2==0 {print ","}; FNR==2 {print "'\''"$1"'\''"}' .versions/node_*`]
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"

  matrix-unit-test:
    needs: read-node-versions
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.read-node-versions.outputs.node-versions) }}
        os: ['ubuntu-22.04', 'ubuntu-24.04', 'windows-latest', 'windows-11-arm', 'ubuntu-22.04-arm', 'ubuntu-24.04-arm', 'macos-15', 'macos-latest']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The introspection tests need a maven that resolves, on every runner
      # image in the matrix, or their healthy java baseline is already floored
      # and the comparison against a broken maven reports a test failure
      # instead of the unusable environment it found. atom needs Java 23 or
      # above on its jar-based triples, one of which is windows-arm64, and
      # Temurin publishes no windows/aarch64 build past 21 - so the
      # distribution here is Liberica, which has a 24 build for every
      # os/architecture pair in this matrix.
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: 'liberica'
          java-version: '24'
      - name: Route Maven Central through Google's mirror
        if: runner.environment == 'github-hosted'
        run: node ci/maven-central-mirror.js
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: pnpm install, build and test
        shell: bash
        run: |
          pnpm install:frozen
          FETCH_LICENSE=true node bin/cdxgen.js --exclude test/\*\* -t js --deep
          pnpm test
        env:
          CI: true

  depscan:
    continue-on-error: true
    runs-on: ["self-hosted", "ubuntu", "arm64"]
    permissions:
      contents: write  # needed for creating GH releases and uploading release assets
    strategy:
      fail-fast: false
      matrix:
        java-version: ['24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.13
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
      - name: Route Maven Central through Google's mirror
        if: runner.environment == 'github-hosted'
        run: node ci/maven-central-mirror.js
      - name: Trim CI agent
        run: rm -rf /tmp/docker-images-* /tmp/atom-* /tmp/mvn-deps*
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: pnpm install
        run: |
          pnpm install:frozen
          python3 -m pip uninstall -y owasp-depscan ds-analysis-lib ds-xbom-lib ds-reporting-lib ds-server-lib atom-tools || true
          python3 -m pip install --pre --upgrade owasp-depscan[all] atom-tools
      - name: check sbom for vulns
        if: github.ref == 'refs/heads/master'
        run: |
          node bin/cdxgen.js -t js -t php -t jar -t ruby -t github -o $(pwd)/reports/sbom-build.cdx.json --include-formulation --export-proto --proto-bin-file $(pwd)/reports/sbom-build.cdx.proto --exclude "**/test/**" $(pwd)
          docker pull ghcr.io/cdxgen/cdxgen:master
          node bin/cdxgen.js -t docker -o $(pwd)/reports/sbom-container-js.cdx.json ghcr.io/cdxgen/cdxgen:master
          depscan --src $(pwd) --bom-dir $(pwd)/reports --reports-dir $(pwd)/reports --reachability-analyzer SemanticReachability --explain
        env:
          COLUMNS: 140
          JAVA_TOOL_OPTIONS: "-XX:UseSVE=0 -Dfile.encoding=UTF-8"
          FETCH_LICENSE: true
      - name: Generate atom and slices
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node bin/cdxgen.js -t js -t php -t jar -t ruby -t github -o $(pwd)/reports/sbom-build.cdx.json --include-formulation --export-proto --proto-bin-file $(pwd)/reports/sbom-build.cdx.proto --exclude "**/test/**" $(pwd)
        env:
          FETCH_LICENSE: true
      - name: Upload atom and slices
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            reports/sbom-build.cdx.json
            reports/sbom-build.cdx.proto
      - name: Cleanup
        run: |
          python3 -m pip uninstall -y owasp-depscan ds-analysis-lib ds-xbom-lib ds-reporting-lib ds-server-lib atom-tools || true
          rm -rf /tmp/docker-images* /tmp/atom-* /tmp/mvn-deps*

  golden-tests:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: pnpm install
        run: pnpm install:frozen
      - name: Run golden SBOM tests
        run: pnpm run test:golden
        env:
          CI: true
      # The default-vs-CDXGEN_RS_DISABLE=all comparison is the safety net for
      # every Rust-backed step in v13, and it was not running anywhere in CI.
      # It is useful even without the cdxrs binary present (it then compares the
      # JS path with itself and still catches golden drift); the job below is the
      # one that gives it teeth.
      - name: Run CDXGEN_RS_DISABLE byte-identical tests
        run: pnpm run test:rs-disable
        env:
          CI: true

  # Re-runs the suites that can only exercise the Rust path when the cdxrs
  # binary exists. CDXGEN_REQUIRE_CDXRS=1 turns a missing or too-old binary into
  # a failure, so this job cannot go green by skipping everything it is here to
  # check.
  rust-fetch-tests:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The introspection tests grade the java tier by comparing a healthy
      # maven run against a deliberately broken one, so the healthy run has to
      # be genuinely healthy. On a runner image whose maven cannot resolve, the
      # baseline is already floored, nothing moves when maven is then killed,
      # and the comparison reports a test failure rather than the unusable
      # environment it actually found. Pinning the JDK keeps that baseline real,
      # on the same distribution and release the unit-test matrix pins, and
      # above the Java 23 floor atom needs.
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: 'liberica'
          java-version: '24'
      - name: Route Maven Central through Google's mirror
        if: runner.environment == 'github-hosted'
        run: node ci/maven-central-mirror.js
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: pnpm install
        run: pnpm install:frozen
      - name: Check the cdxrs binary from cdxgen-plugins-bin
        run: |
          node --input-type=module -e '
          import { cdxrsAvailable, cdxrsBinaryPath } from "./lib/inventory/cdxrs.js";
          const path = cdxrsBinaryPath();
          console.log(`cdxrs: ${path}`);
          for (const sub of ["info", "validate", "fetch"]) {
            const { available, version } = cdxrsAvailable(sub);
            console.log(`  ${sub}: available=${available} version=${version}`);
            if (!available) process.exit(1);
          }
          '
        shell: bash
      - name: Unit tests with the Rust path enabled
        run: pnpm test
        env:
          CI: true
      - name: Golden and byte-identical tests with the Rust path enabled
        run: |
          pnpm run test:golden
          pnpm run test:rs-disable
        env:
          CI: true
          CDXGEN_REQUIRE_CDXRS: '1'

  deno-build:
    strategy:
      fail-fast: true
      matrix:
        os: [windows, macos, ubuntu]
        include:
          - os: windows
            build: |
              deno compile --allow-read --allow-env --allow-run --allow-sys=uid,systemMemoryInfo,gid,osRelease,homedir --allow-write --allow-net --include=./data --include=./package.json --output cdxgenx.exe bin/cdxgen.js
              .\cdxgenx.exe --help
              (Get-FileHash .\cdxgenx.exe).hash | Out-File -FilePath .\cdxgenx.exe.sha256
#              deno compile --allow-read --allow-env --allow-run --allow-sys=uid,systemMemoryInfo,gid,osRelease,homedir --allow-write --allow-net --node-modules-dir=auto --allow-ffi --include=./data --include=./package.json --output evinse.exe bin/evinse.js
#              .\evinse.exe --help
#              (Get-FileHash .\evinse.exe).hash | Out-File -FilePath .\evinse.exe.sha256
            artifact: cdxgenx.exe
          - os: macos
            build: |
              deno compile --allow-read --allow-env --allow-run --allow-sys=uid,systemMemoryInfo,gid,homedir --allow-write --allow-net --include=./data --include=./package.json --target aarch64-apple-darwin --output cdxgenx-darwin-arm64 bin/cdxgen.js
              shasum -a 256 cdxgenx-darwin-arm64 > cdxgenx-darwin-arm64.sha256
              ./cdxgenx-darwin-arm64 --help
#              deno compile --allow-read --allow-env --allow-run --allow-sys=uid,systemMemoryInfo,gid,homedir --allow-write --allow-net --node-modules-dir=auto --allow-ffi --include=./data --include=./package.json --target aarch64-apple-darwin --output evinse-darwin-arm64 bin/evinse.js
#              shasum -a 256 evinse-darwin-arm64 > evinse-darwin-arm64.sha256
#              ./evinse-darwin-arm64 --help
            artifact: cdxgenx-darwin-arm64
          - os: ubuntu
            build: |
              deno compile --allow-read --allow-env --allow-run --allow-sys=uid,systemMemoryInfo,gid,homedir --allow-write --allow-net --include=./data --include=./package.json --output cdxgenx bin/cdxgen.js
              shasum -a 256 cdxgenx > cdxgenx.sha256
              chmod + cdxgenx
              ./cdxgenx --help
#              deno compile --allow-read --allow-env --allow-run --allow-sys=uid,systemMemoryInfo,gid,homedir --allow-write --allow-net --node-modules-dir=auto --allow-ffi --include=./data --include=./package.json --output evinse bin/evinse.js
#              shasum -a 256 evinse > evinse.sha256
#              chmod + evinse
#              ./evinse --help
            artifact: cdxgenx
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed  # v2.0.5
        with:
          deno-version: 2.9.6
      - name: pnpm install, build and test
        run: |
          pnpm install:frozen
      - name: deno compile
        run: |
          deno info bin/cdxgen.js
          deno info bin/evinse.js
          mkdir build
          ${{ matrix.build }}
        continue-on-error: true

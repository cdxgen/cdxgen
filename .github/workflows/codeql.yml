name: "CodeQL Advanced"

# Both analyze jobs are required status checks on master, so this workflow
# must trigger on every pull request and on merge-group builds; a paths
# filter here would leave pull requests touching no code waiting forever
# for a check that never reports.
on:
  pull_request:
  merge_group:
  push:
    branches:
      - master
      - release/*
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
      - '**.js'


# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@52cf1852265d99e9bea071b03366fc777a602909  # codeql-bundle-v2.27.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo 'If you are using a "manual" build mode for one or more of the' \
            'languages you are analyzing, replace this with the commands to build' \
            'your code, for example:'
          echo '  make bootstrap'
          echo '  make release'
          exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@52cf1852265d99e9bea071b03366fc777a602909  # codeql-bundle-v2.27.4
        with:
          category: "/language:${{matrix.language}}"

name: Build image(s) on PR

on:
  pull_request:
    paths:
      - ci/images/**/Dockerfile.*
      - ci/images/common/**
      - ci/Dockerfile-bun
      - ci/Dockerfile-deno

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  filter:
    if: github.repository == 'cdxgen/cdxgen'
    runs-on: ubuntu-24.04
    outputs:
      imagefiles: ${{ steps.changed.outputs.files }}
    steps:
      - name: Get changed files
        id: changed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: context.payload.pull_request.base.sha,
              head: context.payload.pull_request.head.sha
            });

            const changed = (data.files)
              .filter(file => file.status !== 'removed')
              .map(file => file.filename);

            // ci/Dockerfile-bun and ci/Dockerfile-deno publish from the repo
            // root instead of a distro directory. ci/Dockerfile-ppc64 is not
            // built on PRs: powerpc builds are not practical on the PR
            // runners.
            const files = new Set(changed.filter(f =>
              /^ci\/images\/.*\/?Dockerfile.*$/.test(f) ||
              /^ci\/Dockerfile-(bun|deno)$/.test(f)
            ));

            // The shared scripts under ci/images/common/ are baked into every
            // image that sources them, so a change there builds one
            // representative per distro rather than the whole matrix. Between
            // them these cover every branch in mirrors.sh - apk, apt, yum,
            // npm, pip and rubygems - and both cdxgen-build.sh smoke-test and
            // --no-optional paths. The full matrix still runs on push.
            if (changed.some(f => f.startsWith('ci/images/common/'))) {
              [
                'ci/images/alpine/Dockerfile.golang1.27',
                'ci/images/alpine/Dockerfile.ruby3.4',
                'ci/images/debian/Dockerfile.golang1.27',
                'ci/images/debian/Dockerfile.ruby3.4',
                'ci/images/temurin/Dockerfile.java25'
              ].forEach(f => files.add(f));
            }

            core.setOutput("files", JSON.stringify([...files]));
  image:
    if: github.repository == 'cdxgen/cdxgen'
    needs: filter
    strategy:
      fail-fast: false
      matrix:
        imagefile: ${{ fromJson(needs.filter.outputs.imagefiles) }}
        platform: [ amd64, arm64 ]
        # Some images don't work on linux/arm64
        exclude:
          - imagefile: ci/images/Dockerfile.dotnet8
            platform: arm64
          - imagefile: ci/images/Dockerfile.dotnet9
            platform: arm64
          - imagefile: ci/images/Dockerfile.ruby2.5
            platform: arm64
          - imagefile: ci/images/debian/Dockerfile.ruby2.6
            platform: arm64
    runs-on: ${{ matrix.platform == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup tool versions
        id: versions
        run: |
          cd .versions
          cat >> "$GITHUB_OUTPUT" << EOF
          docker-args<<VALUE
          $(awk 'FNR==2 {print "\""toupper(FILENAME)"="$1"\""}' *)
          VALUE
          EOF
      - name: Build image
        if: matrix.imagefile != 'ci/Dockerfile-bun' && matrix.imagefile != 'ci/Dockerfile-deno'
        uses: ./.github/actions/build-docker-image
        with:
          dockerfile: ${{ matrix.imagefile }}
          docker-args: |
            ${{ steps.versions.outputs.docker-args }}
          # PRs push nothing; loading the image into the local daemon lets the
          # smoke test below run it.
          output: type=docker
          platforms: linux/${{ matrix.platform }}
          tags: cdxgen/pr-smoke:${{ matrix.platform }}
          target: ${{ matrix.imagefile == 'ci/images/al10/Dockerfile.ruby-builder' && 'ruby-builder' || 'cdxgen' }}
      # ci/Dockerfile-bun and ci/Dockerfile-deno are single-stage Dockerfiles
      # without a cdxgen stage to target, and build-docker-image always passes
      # a target, so build them directly the way npm-release.yml publishes
      # them. Their versions are pinned inside the Dockerfiles, so the
      # .versions build args do not apply.
      - name: Build bun and deno image
        if: matrix.imagefile == 'ci/Dockerfile-bun' || matrix.imagefile == 'ci/Dockerfile-deno'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.imagefile }}
          outputs: type=docker
          platforms: linux/${{ matrix.platform }}
          tags: cdxgen/pr-smoke:${{ matrix.platform }}
      # Every build-time toolchain must sit under /opt so the image works for
      # non-root users too; a toolchain left under /root fails this run and
      # with it the pull request. The ruby-builder target has no cdxgen.
      - name: Smoke test image as non-root
        if: matrix.imagefile != 'ci/images/al10/Dockerfile.ruby-builder'
        run: |
          docker run --rm --user 1000:1000 --cap-drop=ALL -e HOME=/tmp cdxgen/pr-smoke:${{ matrix.platform }} --version

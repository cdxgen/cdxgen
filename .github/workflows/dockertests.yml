name: docker tests

on:
  pull_request:
    paths:
      - '.github/workflows/dockertests.yml'
      - 'ci/assertions.sh'
      - '.nvmrc'
      - '.pnpmfile.cjs'
      - 'bin/**'
      - 'ci/**'
      - 'data/**'
      - 'index.cjs'
      - 'lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '!**.poku.js'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: {}

# Pinned by digest so a moved tag cannot change what these tests scan. The
# digests were resolved on 2026-10-29; shiftleft/scan-slim has no release tag
# matching its latest build, so only the digest is recorded for it.
env:
  UBUNTU_IMAGE: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
  ALPINE_IMAGE: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  SCAN_SLIM_IMAGE: shiftleft/scan-slim@sha256:1d6fdd871ae0bc80972aa4cc741bd202635c6b4d3c696d0aa15f36f6a2890e3a

jobs:
  linux-tests:
    strategy:
      fail-fast: true
      matrix:
        os: ['ubuntu-24.04', 'ubuntu-24.04-arm']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: pnpm install
        run: |
          pnpm install:frozen
          mkdir -p bomresults
        env:
          CI: true
          CDXGEN_TEMP_DIR: ${{ runner.temp }}/cdxgen-dockertests
      - name: dockertests
        if: matrix.os == 'ubuntu-24.04'
        run: |
          source ci/assertions.sh
          bin/cdxgen.js "$UBUNTU_IMAGE" -p -t docker -o bomresults/bom-ubuntu.json --fail-on-error
          bin/cdxgen.js "$UBUNTU_IMAGE" -p -t docker -o bomresults/bom-ubuntu-audit.json --bom-audit --bom-audit-categories container-risk --fail-on-error
          assert_container_audit_bom bomresults/bom-ubuntu-audit.json
          assert_trivy_tool_identity_bom bomresults/bom-ubuntu-audit.json
          docker rmi "$UBUNTU_IMAGE"
          bin/cdxgen.js "$ALPINE_IMAGE" -p -t docker -o bomresults/bom-alpine.json --fail-on-error
          bin/cdxgen.js "$ALPINE_IMAGE" -p -t docker -o bomresults/bom-alpine-audit.json --bom-audit --bom-audit-categories container-risk --fail-on-error
          assert_container_audit_bom bomresults/bom-alpine-audit.json
          assert_trivy_tool_identity_bom bomresults/bom-alpine-audit.json
          docker rmi "$ALPINE_IMAGE"
          bin/cdxgen.js almalinux:9.4-minimal -p -t docker -o bomresults/bom-almalinux.json --fail-on-error
          docker rmi almalinux:9.4-minimal
          bin/cdxgen.js phpmyadmin@sha256:1092481630056189e43cc0fe66fd01defcc9334d78ab4611b22f65e9a39869bd -p -o bomresults/bom-phpmyadmin.json --fail-on-error
          jq -e '.components | map(select((.properties // [])[] | select(.name == "cdx:php:buildVersion"))) | length > 0' bomresults/bom-phpmyadmin.json
          docker rmi phpmyadmin@sha256:1092481630056189e43cc0fe66fd01defcc9334d78ab4611b22f65e9a39869bd
          bin/cdxgen.js "$SCAN_SLIM_IMAGE" -o bomresults/bom-scanslim.json -p -t container --fail-on-error
          docker rmi "$SCAN_SLIM_IMAGE"
          bin/cdxgen.js redmine@sha256:a5c5f8a64a0d9a436a0a6941bc3fb156be0c89996add834fe33b66ebeed2439e -p -o bomresults/bom-redmine.json --fail-on-error
          docker rmi redmine@sha256:a5c5f8a64a0d9a436a0a6941bc3fb156be0c89996add834fe33b66ebeed2439e
          bin/cdxgen.js rocket.chat@sha256:379f7afa0e67497c363ac9a9b3e7e6a6d31deee228233307c987e4a0c68b28e6 -p -o bomresults/bom-rocket.json --fail-on-error
          docker rmi rocket.chat@sha256:379f7afa0e67497c363ac9a9b3e7e6a6d31deee228233307c987e4a0c68b28e6
          bin/cdxgen.js sonarqube@sha256:7c0edcb99c964984db6d24330db33bb12de1e8ae0d5974d77640b1efea1483d1 -p -o bomresults/bom-sonar.json --fail-on-error
          docker rmi sonarqube@sha256:7c0edcb99c964984db6d24330db33bb12de1e8ae0d5974d77640b1efea1483d1
          bin/cdxgen.js zookeeper@sha256:5bf00616677db5ef57d8a2da7c5dadf67f1a6be54b0c33a79be3332c9c80aeb6 -p -o bomresults/bom-zoo.json --fail-on-error
          docker rmi zookeeper@sha256:5bf00616677db5ef57d8a2da7c5dadf67f1a6be54b0c33a79be3332c9c80aeb6
          # shiftleft/scan-slim:latest is a continuously built tag with no
          # matching version tag, so pin the digest it pointed to on 2026-10-29.
          docker pull "$SCAN_SLIM_IMAGE"
          docker save "$SCAN_SLIM_IMAGE" -o /tmp/scanslim.tar
          docker rmi "$SCAN_SLIM_IMAGE"
          bin/cdxgen.js /tmp/scanslim.tar -p -o bomresults/bom-scanarch.json --fail-on-error
          rm /tmp/scanslim.tar
          ls -ltr bomresults
        env:
          CDXGEN_DEBUG_MODE: debug
      - name: dockertests arm
        run: |
          bin/cdxgen.js "$UBUNTU_IMAGE" -p -t docker -o bomresults/bom-ubuntu.json --fail-on-error
          docker rmi "$UBUNTU_IMAGE"
          bin/cdxgen.js "$ALPINE_IMAGE" -p -t docker -o bomresults/bom-alpine.json --fail-on-error
          docker rmi "$ALPINE_IMAGE"
          bin/cdxgen.js almalinux:9.4-minimal -p -t docker -o bomresults/bom-almalinux.json --fail-on-error
          docker rmi almalinux:9.4-minimal
          ls -ltr bomresults
        env:
          CDXGEN_DEBUG_MODE: debug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: bomresults-docker-${{ matrix.os }}
          path: bomresults
          if-no-files-found: warn
  linux-dockertar-tests:
    strategy:
      fail-fast: true
      matrix:
        os: ['ubuntu-24.04', 'ubuntu-24.04-arm']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: pnpm install
        run: |
          pnpm install:frozen
          mkdir -p bomresults repotests
        env:
          CI: true
      - name: dockertests
        run: bash ci/dockertests.sh docker
        env:
          CDXGEN_DEBUG_MODE: debug
  linux-podman-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: pnpm install
        run: |
          pnpm install:frozen
          mkdir -p bomresults
        env:
          CI: true
          CDXGEN_TEMP_DIR: ${{ runner.temp }}/cdxgen-podmantests
      - name: podmantests
        run: bash ci/dockertests.sh podman
        env:
          CDXGEN_DEBUG_MODE: debug
  linux-nerdctl-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: pnpm install
        run: |
          pnpm install:frozen
          mkdir -p bomresults
        env:
          CI: true
          CDXGEN_TEMP_DIR: ${{ runner.temp }}/cdxgen-nerdctltests
      - name: nerdctltests
        run: bash ci/dockertests.sh nerdctl
        env:
          CDXGEN_DEBUG_MODE: debug
  os-tests:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: pnpm install, build and test
        run: |
          pnpm install:frozen
          mkdir -p bomresults
        env:
          CI: true
      - name: ostests
        run: |
          bin/cdxgen.js -t os -o bomresults/bom-os.json --fail-on-error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: bomresults-os-${{ matrix.os }}
          path: bomresults
          if-no-files-found: warn

  win-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: pnpm install, build
        run: |
          pnpm install:frozen
          mkdir bomresults
        env:
          CI: true
      - name: wintests
        run: |
          node bin/cdxgen.js -t os -o bomresults/bom-win.json --fail-on-error
          dir bomresults
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bomresults-win
          path: bomresults

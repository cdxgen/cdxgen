name: Test Node.js nightly build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ 'macos-15', 'ubuntu-24.04', 'ubuntu-24.04-arm', 'windows-11-arm', 'windows-2022', 'windows-2025' ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Install latest Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26-nightly
          package-manager-cache: false
      - name: Route Maven Central through Google's mirror
        if: runner.environment == 'github-hosted'
        run: node ci/maven-central-mirror.js
      - name: Test
        run: |
          pnpm install:frozen
          pnpm test

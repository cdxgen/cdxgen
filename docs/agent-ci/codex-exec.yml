# Example: generate an SBOM with `codex exec --json`.
#
# Copy this file to .github/workflows/ in your own repository. It is not run by
# the cdxgen project. See docs/AGENT_CI.md for what each setting does, and why
# openai/codex-action is the better choice on GitHub-hosted runners.
#
# Needs one repository secret, OPENAI_API_KEY, that you create yourself.
name: SBOM through codex exec

on:
  workflow_dispatch:

permissions: {}

jobs:
  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Exact releases. Change them on purpose, never to "latest".
      CDXGEN_VERSION: "13.7.0"
      CODEX_VERSION: "0.137.0"
      # The cdxgen tag that holds the skills. A commit SHA pins it harder.
      CDXGEN_REF: "v13.7.0"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install cdxgen and Codex
        run: |
          npm install --global --no-fund --omit=optional --ignore-scripts "@cdxgen/cdxgen@${CDXGEN_VERSION}"
          npm install --global --no-fund --ignore-scripts "@openai/codex@${CODEX_VERSION}"
          cdxgen --version
          codex --version

      - name: Make the cdxgen skills available to Codex
        run: |
          git init --quiet "$RUNNER_TEMP/cdxgen-src"
          git -C "$RUNNER_TEMP/cdxgen-src" fetch --quiet --depth 1 https://github.com/cdxgen/cdxgen.git "$CDXGEN_REF"
          git -C "$RUNNER_TEMP/cdxgen-src" checkout --quiet FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/codex-home"
          cp -R "$RUNNER_TEMP/cdxgen-src/agent-plugin/skills" "$RUNNER_TEMP/cdxgen-src/agent-plugin/reference" "$RUNNER_TEMP/codex-home/"

      - name: Generate the SBOM
        # The key is set for this step only, as the Codex documentation advises.
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_HOME: ${{ runner.temp }}/codex-home
          WORKSPACE: ${{ github.workspace }}
        run: |
          PROMPT="Use the cdxgen skills to generate a CycloneDX SBOM of the project at ${WORKSPACE} and write it to ${WORKSPACE}/bom.json.

          This is an unattended CI run and nobody can answer questions, so the approval that the safety rules ask for is given here, for this one scan only:
          - Run cdxgen with --dry-run --activity-report json first. Stop without scanning if the report shows package installs, network access beyond package registries, or writes outside the workspace.
          - Run the real scan with --no-install-deps and absolute paths.
          - Run no other command, upload nothing, and never print environment variables or credentials.

          End with a short Markdown summary: the command you ran, the number of components in the BOM, and anything a person needs to look at."
          codex exec --json --ephemeral --skip-git-repo-check \
            -C "$WORKSPACE" \
            -c 'default_permissions=":workspace"' \
            --output-last-message "$RUNNER_TEMP/codex-final.md" \
            "$PROMPT" > "$RUNNER_TEMP/codex-events.jsonl"

      - name: Fail when the run reported an error
        if: ${{ !cancelled() }}
        run: |
          if jq -e 'select(.type == "error" or .type == "turn.failed")' "$RUNNER_TEMP/codex-events.jsonl" > /dev/null; then
            echo "::error::Codex reported an error; see the event stream"
            jq -c 'select(.type == "error" or .type == "turn.failed")' "$RUNNER_TEMP/codex-events.jsonl"
            exit 1
          fi

      - name: Write the summary
        if: ${{ !cancelled() }}
        run: |
          cat "$RUNNER_TEMP/codex-final.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the BOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bom
          path: bom.json
          if-no-files-found: error
          retention-days: 7

# Example: generate an SBOM through Claude Code with anthropics/claude-code-action.
#
# Copy this file to .github/workflows/ in your own repository. It is not run by
# the cdxgen project. See docs/AGENT_CI.md for what each setting does.
#
# Needs one repository secret, ANTHROPIC_API_KEY, that you create yourself.
name: SBOM through Claude Code

on:
  workflow_dispatch:

permissions: {}

jobs:
  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Exact cdxgen release. Change it on purpose, never to "latest".
      CDXGEN_VERSION: "13.7.0"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install cdxgen
        run: |
          npm install --global --no-fund --omit=optional --ignore-scripts "@cdxgen/cdxgen@${CDXGEN_VERSION}"
          cdxgen --version

      - name: Generate the SBOM with Claude Code
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d  # v1.0.266
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          plugin_marketplaces: https://github.com/cdxgen/cdxgen.git
          plugins: cdxgen@cdxgen-plugins
          display_report: "true"
          claude_args: |
            --max-turns 20
            --allowedTools "Skill,Read,Glob,Grep,Bash(cdxgen:*)"
          prompt: |
            Use the cdxgen skills to generate a CycloneDX SBOM of the project at
            ${{ github.workspace }} and write it to ${{ github.workspace }}/bom.json.

            This is an unattended CI run and nobody can answer questions, so the
            approval that the safety rules ask for is given here, for this one
            scan only:
            - Run cdxgen with --dry-run --activity-report json first. Stop
              without scanning if the report shows package installs, network
              access beyond package registries, or writes outside the workspace.
            - Run the real scan with --no-install-deps and absolute paths.
            - Run no other command, upload nothing, and never print environment
              variables or credentials.

            End with a short Markdown summary: the command you ran, the number
            of components in the BOM, and anything a person needs to look at.

      - name: Upload the BOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bom
          path: bom.json
          if-no-files-found: error
          retention-days: 7

    }

- id: INT-022
  name: "Cargo version crates.io does not list"
  description: >-
    The manifest names a crate version crates.io never published or has since
    removed. A yanked crate stays downloadable through a lockfile, but a
    deleted or never-published version cannot be verified at all.
  severity: high
  category: package-integrity
  dry-run-support: no
  condition: |
    components[

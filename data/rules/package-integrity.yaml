- id: INT-011
  name: "Rust project uses native Cargo build surface"
  description: "Cargo build scripts and native build helpers expand execution surface during build and deserve additional review before release"
  severity: medium
  category: package-integrity
  dry-run-support: full
  condition: |
    formulation.components[
      $prop($, 'cdx:rust:buildTool') = 'cargo'
      and $prop($, 'cdx:cargo:hasNativeBuild') = 'true'
    ]
  location: |
    {
      "bomRef": $."bom-ref",
      "file": $prop($, 'internal:SrcFile')
    }
  message: "Rust project '{{ name }}' uses Cargo build.rs or native build helpers"
  mitigation: "Review `build.rs`, native build dependencies, and release workflows to ensure the build remains hermetic and expected"
  evidence: |
    {
      "buildScript": $prop($, 'cdx:cargo:buildScript'),
      "nativeBuildIndicators": $prop($, 'cdx:cargo:nativeBuildIndicators'),
      "releaseProfiles": $prop($, 'cdx:cargo:releaseProfiles')
    }

- id: INT-012
  name: "Rust native build uses mutable Cargo setup action"
  description: "Native Cargo build surfaces deserve additional scrutiny when the workflow relies on mutable Cargo toolchain setup actions instead of immutable SHA-pinned references"
  severity: medium
  category: package-integrity
  dry-run-support: full
  variables:
    toolchainActions: |
      components[
        $prop($, 'cdx:github:action:ecosystem') = 'cargo'
        and $contains($nullSafeProp($, 'cdx:github:action:role'), 'toolchain')
        and $prop($, 'cdx:github:action:versionPinningType') != 'sha'
        and $prop($, 'cdx:github:action:isLocked') != 'true'
      ]
    toolchainActionUses: |
      $toolchainActions[[0..24]].$prop($, 'cdx:github:action:uses')
  condition: |
    $count($toolchainActions) > 0 ? formulation.components[
      $prop($, 'cdx:rust:buildTool') = 'cargo'
      and $prop($, 'cdx:cargo:hasNativeBuild') = 'true'
    ]
  location: |
    {
      "bomRef": $."bom-ref",
      "file": $prop($, 'internal:SrcFile')
    }
  message: "Rust project '{{ name }}' combines native Cargo build surfaces with mutable Cargo toolchain setup actions"
  mitigation: "Prefer SHA-pinned Cargo toolchain setup actions for release workflows, especially when build.rs or native helpers run during CI"
  evidence: |
    {
      "buildScript": $prop($, 'cdx:cargo:buildScript'),
      "buildScriptCapabilities": $prop($, 'cdx:cargo:buildScriptCapabilities'),
      "toolchainActionCount": $count($toolchainActions),
      "toolchainActions": $toolchainActionUses
    }

- id: INT-013
  name: "Rust native build is exercised by Cargo workflow steps"
  description: "Cargo workflows that execute build/test/package/publish steps against native build surfaces increase the impact of build-script or native-helper changes"
  severity: medium
  category: package-integrity
  dry-run-support: full
  variables:
    cargoSteps: |
      components[
        $prop($, 'cdx:github:step:usesCargo') = 'true'
        and (
          $contains($nullSafeProp($, 'cdx:github:step:cargoSubcommands'), 'build')
          or $contains($nullSafeProp($, 'cdx:github:step:cargoSubcommands'), 'test')
          or $contains($nullSafeProp($, 'cdx:github:step:cargoSubcommands'), 'package')
          or $contains($nullSafeProp($, 'cdx:github:step:cargoSubcommands'), 'publish')
        )
      ]
    cargoStepCommands: |
      $cargoSteps[[0..24]].$prop($, 'cdx:github:step:command')
  condition: |
    $count($cargoSteps) > 0 ? formulation.components[
      $prop($, 'cdx:rust:buildTool') = 'cargo'
      and $prop($, 'cdx:cargo:hasNativeBuild') = 'true'
      and (
        $contains($nullSafeProp($, 'cdx:cargo:buildScriptCapabilities'), 'process-execution')
        or $contains($nullSafeProp($, 'cdx:cargo:buildScriptCapabilities'), 'network-access')
        or $contains($nullSafeProp($, 'cdx:cargo:nativeBuildIndicators'), '-sys')
      )
    ]
  location: |
    {
      "bomRef": $."bom-ref",
      "file": $prop($, 'internal:SrcFile')
    }
  message: "Rust project '{{ name }}' runs Cargo build/test/package workflow steps against a native build surface"
  mitigation: "Review build.rs, native helper crates, and workflow command scope before merging or publishing releases that exercise native build logic"
  evidence: |
    {
      "buildScriptCapabilities": $prop($, 'cdx:cargo:buildScriptCapabilities'),
      "nativeBuildIndicators": $prop($, 'cdx:cargo:nativeBuildIndicators'),
      "cargoCommandCount": $count($cargoSteps),
      "cargoCommands": $cargoStepCommands
    }

- id: INT-014
  name: "Collider package missing valid wrap hash pin"
  description: "Collider lock entries should carry a SHA-256 wrap_hash so the selected wrap file remains integrity-pinned and reproducible"
  severity: high
  category: package-integrity
  dry-run-support: full
  condition: |
    components[
      $hasProp($, 'cdx:collider:dependencyKind')
      and $prop($, 'cdx:collider:hasWrapHash') = 'false'
    ]
  location: |
    { "bomRef": $."bom-ref", "purl": purl }
  message: "Collider package '{{ name }}@{{ version }}' is missing a valid wrap hash integrity pin"
  mitigation: "Recreate collider.lock with valid wrap_hash values and verify the lockfile against the repository before release"
  evidence: |
    {
      "wrapHash": $prop($, 'cdx:collider:wrapHash'),
      "wrapHashInvalid": $prop($, 'cdx:collider:wrapHashInvalid'),
      "origin": $prop($, 'cdx:collider:origin'),
      "dependencyKind": $prop($, 'cdx:collider:dependencyKind')
    }

- id: INT-015
  name: "Ruby gem compiles native extensions at install time"
  description: "A gem that declares extensions runs extconf.rb and a compiler on the install host, so installing it executes arbitrary code from the gem author. This is the RubyGems equivalent of an npm install script"
  severity: low
  category: package-integrity
  dry-run-support: full
  condition: |
    components[
      $hasProp($, 'cdx:gem:extensions')
    ]
  location: |
    { "bomRef": $."bom-ref", "purl": purl }
  message: "Ruby gem '{{ name }}@{{ version }}' compiles native extensions at install time ({{ $prop($, 'cdx:gem:extensions') }})"
  mitigation: "Prefer the precompiled native gem for your platform so that no compiler runs at install time, and review the extconf.rb of gems you build from source"
  evidence: |
    {
      "extensions": $prop($, 'cdx:gem:extensions'),
      "platform": $contains(purl, 'platform=') ? $substringAfter(purl, 'platform=') : 'ruby',
      "requiredRubyVersion": $prop($, 'cdx:gem:rubyVersionSpecifiers')
    }

- id: INT-016
  name: "Gradle verification metadata disagrees with the artifact digest"
  description: >-
    A component carries cdx:gradle:verificationMismatch=true: the digest
    gradle/verification-metadata.xml records for this component's artifact
    differs from the digest cdxgen computed from the artifact in the local
    cache. A released Maven version does not change after publishing, so a
    stale file cannot explain this. The likely causes are an artifact
    republished on a mirror or internal repository, or a corrupted or
    tampered cache. The recorded digest is never applied over the
    artifact's own, and SNAPSHOT versions are not compared.
  severity: high
  category: package-integrity
  dry-run-support: full
  condition: |
    components[
      $prop($, 'cdx:gradle:verificationMismatch') = 'true'
    ]
  location: |
    { "bomRef": $."bom-ref", "purl": purl }
  message: "The digest gradle/verification-metadata.xml records for '{{ name }}@{{ version }}' differs from the digest of the artifact on disk"
  mitigation: "Compare the jar in the local cache with the copy the repository serves, and find out which repository or mirror served the differing one. Regenerate gradle/verification-metadata.xml only after that check: regenerating it first records the suspect digest and removes the evidence"
  evidence: |
    {
      "verificationMethods": $prop($, 'cdx:gradle:verificationMethods'),
      "pgpKeyIds": $prop($, 'cdx:gradle:pgpKeyIds')
    }

- id: INT-017
  name: "Private npm package name on the public registry"
  description: >-
    A component whose name starts with a namespace or prefix the caller
    declared private is published on the public npm registry. An install
    that finds no private copy falls back to whatever public package claims
    the name, which is how dependency confusion compromises builds.
  severity: high
  category: package-integrity
  dry-run-support: full
  # Only a name the public registry holds is the confusion setup. A private
  # package that resolves from its own index and is not on the public one is
  # the intended state, and a name the public registry did not answer about
  # is not reported as taken.
  condition: |
    components[
      $hasProp($, 'cdx:npm:privateNamespace')
      and $prop($, 'cdx:npm:publicRegistry') = 'true'
    ]
  location: |
    { "bomRef": $."bom-ref", "purl": purl }
  message: "npm package '{{ name }}@{{ version }}' matches the private namespace '{{ $prop($, 'cdx:npm:privateNamespace') }}', and the public npm registry holds that name"
  mitigation: "Publish a placeholder under the name in your private registry, or reserve the name publicly, so a build can never silently resolve the public package"
  evidence: |
    {
      "matchedPrefix": $prop($, 'cdx:npm:privateNamespace'),
      "onPublicRegistry": $prop($, 'cdx:npm:publicRegistry')
    }


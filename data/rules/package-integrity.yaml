- id: INT-020
  name: "npm version the registry does not list"
  description: >-
    The manifest names a version the public registry never published or has
    since removed. The requirement is unsatisfiable as written, so installs
    either fail or silently resolve something else, and a removed version is
    the usual aftermath of a compromised or yanked release.
  severity: high
  category: package-integrity
  dry-run-support: no
  condition: |
    components[
      $prop($, 'cdx:npm:versionMissing') = 'true'
    ]
  location: |
    { "bomRef": $."bom-ref", "purl": purl }
  message: "npm package '{{ name }}@{{ version }}' is not in the registry's version list"
  mitigation: "Find out why the version disappeared (yanked, deleted, or never published) and pin the requirement to a version the registry serves"
  evidence: |
    {
      "versionCount": $prop($, 'cdx:npm:versionCount')
    }


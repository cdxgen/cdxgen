  message: "npm package '{{ name }}' has had no registry activity since {{ $prop($, 'cdx:npm:lastModifiedTime') }}"
  mitigation: "Plan a migration to a maintained alternative, or adopt the package into your own maintenance"
  evidence: |
    {
      "lastModifiedTime": $prop($, 'cdx:npm:lastModifiedTime')
    }


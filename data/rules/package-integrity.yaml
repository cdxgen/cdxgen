- id: INT-029
  name: "npm package ships native platform binaries"
  description: >-
    The version carries native code: it is published for named platforms (an
    os, cpu or libc constraint), builds with node-gyp from a binding.gyp, or
    names a host it downloads a prebuilt binary from at install time.
    Compiled artifacts cannot be read the way source can, and a hijacked
    binary distribution reaches every platform the package ships for. It is
    a property of many widely used packages, so the finding is triage
    context about where compiled code enters the tree.
  severity: low
  category: package-integrity
  dry-run-support: no
  # A `bin` entry is not one of these: it names a script the package runs,
  # and most command-line tools are plain JavaScript. The platform and build
  # properties are recorded from a project's own manifest by the parser and
  # for every published version by the registry lookup.
  condition: |
    components[
      $hasProp($, 'cdx:npm:os')
      or $hasProp($, 'cdx:npm:libc')
      or $hasProp($, 'cdx:npm:cpu')
      or $prop($, 'cdx:npm:gypfile') = 'true'
      or $hasProp($, 'cdx:npm:binaryHost')
    ]
  location: |
    { "bomRef": $."bom-ref", "purl": purl }
  message: "npm package '{{ name }}@{{ version }}' ships native or platform-specific binaries"
  mitigation: "Review where the binaries come from and how they are built, and prefer packages that build from source on install"
  evidence: |
    {
      "operatingSystems": $prop($, 'cdx:npm:os'),
      "libcs": $prop($, 'cdx:npm:libc'),
      "architectures": $prop($, 'cdx:npm:cpu'),
      "gypfile": $prop($, 'cdx:npm:gypfile'),
      "binaryHost": $prop($, 'cdx:npm:binaryHost')
    }

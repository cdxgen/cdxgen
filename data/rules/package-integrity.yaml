- id: INT-026
  name: "npm package without any release in six years"
  description: >-
    The registry has not heard from the package in over six years: the
    latest release, and every other signal the registry offers, stopped
    updating. Unmaintained packages accumulate unresolved vulnerabilities and
    their published artifacts may no longer match the source anyone can read.
  severity: low
  category: package-integrity
  dry-run-support: no
  condition: |
    components[
      $hasProp($, 'cdx:npm:lastModifiedTime')
      and $toMillis($prop($, 'cdx:npm:lastModifiedTime')) < ($toMillis($now()) - 189216000000)
    ]

      "versionCount": $prop($, 'cdx:cargo:versionCount')
    }

- id: INT-023
  name: "npm package first published inside the quarantine window"
  description: >-
    The package appeared on the registry within the last year. Fresh packages
    are where impersonation and typosquatting land first, and a compromised
    release usually publishes days before it is pulled, so treat new
    dependencies as unproven until they have aged through a quarantine
    period.
  severity: low
  category: package-integrity
  dry-run-support: no
  condition: |
    components[
      $hasProp($, 'cdx:npm:packageCreatedTime')
      and $toMillis($prop($, 'cdx:npm:packageCreatedTime')) > ($toMillis($now()) - 31536000000)
    ]
  location: |
    { "bomRef": $."bom-ref", "purl": purl }
  message: "npm package '{{ name }}' was first published on {{ $prop($, 'cdx:npm:packageCreatedTime') }}, inside the one-year quarantine window"
  mitigation: "Let the package age, or review its source and provenance before adopting it as a dependency"
  evidence: |
    {
      "packageCreatedTime": $prop($, 'cdx:npm:packageCreatedTime'),

# CBOM Security and Compliance Rules
# Category: cbom-security, cbom-compliance
# Evaluates cryptographic assets (algorithms, protocols, certificates, related-crypto-material) for weaknesses.

- id: CBS-001
  name: "Weak/Deprecated Cryptographic Algorithm"
  description: "Usage of weak or deprecated cryptographic algorithms such as MD5, SHA-1, RC4, DES, 3DES, or Blowfish exposes data to decryption or collision attacks."
  severity: high
  category: cbom-security
  dry-run-support: full
  standards:
    nist-800-53:
      - "SC-13 Cryptographic Protection"
    iso-27001:
      - "A.8.24 Use of cryptography"
  condition: |
    components[
      cryptoProperties.assetType = 'algorithm'
      and (
        $contains($lowercase($safeStr(cryptoProperties.algorithmProperties.algorithmFamily)), 'md5')
        or $contains($lowercase($safeStr(cryptoProperties.algorithmProperties.algorithmFamily)), 'sha-1')
        or $contains($lowercase($safeStr(cryptoProperties.algorithmProperties.algorithmFamily)), 'sha1')
        or $contains($lowercase($safeStr(cryptoProperties.algorithmProperties.algorithmFamily)), 'rc4')
        or $contains($lowercase($safeStr(cryptoProperties.algorithmProperties.algorithmFamily)), 'des')
        or $contains($lowercase($safeStr(cryptoProperties.algorithmProperties.algorithmFamily)), 'blowfish')
        or $contains($lowercase($safeStr(cryptoProperties.algorithmProperties.algorithmFamily)), 'md4')
        or $contains($lowercase($safeStr(cryptoProperties.algorithmProperties.algorithmFamily)), 'rc2')
      )
    ]
  location: |
    {
      "bomRef": $firstNonEmpty($."bom-ref", bom.serialNumber)
    }
  message: "Weak/Deprecated cryptographic algorithm family '{{ cryptoProperties.algorithmProperties.algorithmFamily }}' detected in component '{{ name }}'"
  mitigation: "Migrate to secure alternatives like SHA-256, SHA-3, or AES-GCM."
  evidence: |
    {
      "algorithmFamily": cryptoProperties.algorithmProperties.algorithmFamily,
      "primitive": cryptoProperties.algorithmProperties.primitive
    }

- id: CBS-002
  name: "Insecure Cipher Mode of Operation"
  description: "Electronic Codebook (ECB) mode lacks cryptographic diffusion and exposes patterns in ciphertext, while Cipher Block Chaining (CBC) without authenticated encryption (AEAD) is vulnerable to padding oracle attacks."
  severity: high
  category: cbom-security
  dry-run-support: full
  standards:
    nist-800-53:
      - "SC-13 Cryptographic Protection"
  condition: |
    components[
      cryptoProperties.assetType = 'algorithm'
      and (
        cryptoProperties.algorithmProperties.mode = 'ecb'
        or (cryptoProperties.algorithmProperties.mode = 'cbc' and cryptoProperties.algorithmProperties.primitive != 'ae')
      )
    ]
  location: |
    {
      "bomRef": $firstNonEmpty($."bom-ref", bom.serialNumber)
    }
  message: "Insecure cipher mode '{{ cryptoProperties.algorithmProperties.mode }}' detected for component '{{ name }}'"
  mitigation: "Use authenticated encryption modes such as GCM or CCM."
  evidence: |
    {
      "algorithmFamily": cryptoProperties.algorithmProperties.algorithmFamily,
      "mode": cryptoProperties.algorithmProperties.mode,
      "primitive": cryptoProperties.algorithmProperties.primitive
    }

- id: CBS-003
  name: "Insufficient Classical Security Level or Key Size"
  description: "Symmetric algorithms with security levels under 128 bits, or asymmetric algorithms (like RSA) with keys under 2048 bits, are vulnerable to brute-force attacks."
  severity: high
  category: cbom-security
  dry-run-support: full
  standards:
    nist-800-53:
      - "SC-13 Cryptographic Protection"
  condition: |
    components[
      (
        cryptoProperties.assetType = 'algorithm'
        and $number(cryptoProperties.algorithmProperties.classicalSecurityLevel) > 0
        and $number(cryptoProperties.algorithmProperties.classicalSecurityLevel) < 128
      )
      or (
        cryptoProperties.assetType = 'related-crypto-material'
        and cryptoProperties.relatedCryptoMaterialProperties.type = 'private-key'
        and $number(cryptoProperties.relatedCryptoMaterialProperties.size) > 0
        and $number(cryptoProperties.relatedCryptoMaterialProperties.size) < 2048
      )
    ]
  location: |
    {
      "bomRef": $firstNonEmpty($."bom-ref", bom.serialNumber)
    }
  message: "Cryptographic strength is insufficient: {{ $firstNonEmpty(cryptoProperties.algorithmProperties.classicalSecurityLevel, cryptoProperties.relatedCryptoMaterialProperties.size) }} bits"
  mitigation: "Upgrade key lengths to at least 128 bits for symmetric keys and 2048 bits (preferably 3072 or 4096 bits) for asymmetric/RSA keys."
  evidence: |
    {
      "assetType": cryptoProperties.assetType,
      "classicalSecurityLevel": cryptoProperties.algorithmProperties.classicalSecurityLevel,
      "keySize": cryptoProperties.relatedCryptoMaterialProperties.size
    }

- id: CBS-004
  name: "Outdated/Insecure Protocol Version"
  description: "Outdated protocols such as SSL v2, SSL v3, TLS 1.0, or TLS 1.1 contain severe vulnerabilities and should be disabled in favor of TLS 1.2 or TLS 1.3."
  severity: critical
  category: cbom-security
  dry-run-support: full
  standards:
    nist-800-53:
      - "SC-8 Transmission Confidentiality and Integrity"
  condition: |
    components[
      cryptoProperties.assetType = 'protocol'
      and (
        cryptoProperties.protocolProperties.type = 'tls' or cryptoProperties.protocolProperties.type = 'dtls'
      )
      and (
        $contains($lowercase($safeStr(cryptoProperties.protocolProperties.version)), '1.0')
        or $contains($lowercase($safeStr(cryptoProperties.protocolProperties.version)), '1.1')
        or $contains($lowercase($safeStr(cryptoProperties.protocolProperties.version)), 'ssl')
        or $contains($lowercase($safeStr(cryptoProperties.protocolProperties.version)), '2.0')
        or $contains($lowercase($safeStr(cryptoProperties.protocolProperties.version)), '3.0')
      )
    ]
  location: |
    {
      "bomRef": $firstNonEmpty($."bom-ref", bom.serialNumber)
    }
  message: "Insecure protocol version '{{ cryptoProperties.protocolProperties.version }}' detected for component '{{ name }}'"
  mitigation: "Require TLS 1.2 or TLS 1.3 as the minimum protocol version."
  evidence: |
    {
      "protocol": cryptoProperties.protocolProperties.type,
      "version": cryptoProperties.protocolProperties.version
    }

- id: CBC-001
  name: "Expired Certificate"
  description: "A certificate whose validity ended before the audit ran will fail trust validation and cause service disruptions."
  severity: high
  category: cbom-compliance
  dry-run-support: full
  condition: |
    components[
      cryptoProperties.assetType = 'certificate'
      and $certEndMillis(cryptoProperties.certificateProperties.notValidAfter) != null
      and $certEndMillis(cryptoProperties.certificateProperties.notValidAfter) < $toMillis($now())
    ]
  location: |
    {
      "bomRef": $firstNonEmpty($."bom-ref", bom.serialNumber)
    }
  message: "Certificate for Subject '{{ cryptoProperties.certificateProperties.subjectName }}' expired on {{ cryptoProperties.certificateProperties.notValidAfter }}"
  mitigation: "Renew the certificate and update the deployment trust stores."
  evidence: |
    {
      "subject": cryptoProperties.certificateProperties.subjectName,
      "issuer": cryptoProperties.certificateProperties.issuerName,
      "notValidAfter": cryptoProperties.certificateProperties.notValidAfter
    }

- id: CBC-002
  name: "Certificate expiring within 30 days"
  description: "A certificate that is still valid but expires within 30 days will soon cause trust validation failures."
  severity: medium
  category: cbom-compliance
  dry-run-support: full
  condition: |
    components[
      cryptoProperties.assetType = 'certificate'
      and $certEndMillis(cryptoProperties.certificateProperties.notValidAfter) != null
      and $certEndMillis(cryptoProperties.certificateProperties.notValidAfter) >= $toMillis($now())
      and $certEndMillis(cryptoProperties.certificateProperties.notValidAfter) < ($toMillis($now()) + 2592000000)
    ]
  location: |
    {
      "bomRef": $firstNonEmpty($."bom-ref", bom.serialNumber)
    }
  message: "Certificate for Subject '{{ cryptoProperties.certificateProperties.subjectName }}' expires on {{ cryptoProperties.certificateProperties.notValidAfter }}"
  mitigation: "Plan the certificate renewal and update the deployment trust stores before it expires."
  evidence: |
    {
      "subject": cryptoProperties.certificateProperties.subjectName,
      "issuer": cryptoProperties.certificateProperties.issuerName,
      "notValidAfter": cryptoProperties.certificateProperties.notValidAfter
    }

# The eight SPKI SHA-256 hashes Go 1.27.3 and 1.26.10 hard-code into
# crypto/x509 (CVE-2026-111943).
# https://github.com/golang/go/commit/90617fb7ceb59cf08bee7826bb51b8c8fb8c11de
- id: CBC-003
  name: "Certificate or key distrusted by Go (CVE-2026-111943)"
  description: "Go 1.27.3 and 1.26.10 reject every chain containing one of eight intermediate CA keys, matched by the SHA-256 of the certificate's SubjectPublicKeyInfo. The hash matches re-issued and cross-signed copies of the same key as well."
  severity: high
  category: cbom-security
  dry-run-support: full
  standards:
    nist-800-53:
      - "SC-13 Cryptographic Protection"
  condition: |
    (
      $deny := [
        "ebed6475c2c2d80fcb199f3fe8dd6e6b3ce60b77eb15d4e42c3dec0c6f5b5105",
        "49dd353dc2b919a3770645117d0e60c16115e7d1bc259eefe734b00ea434fe5f",
        "e0254c7fcdc265e2f0f8a428dabb75ab4ae039b4872d62f5ee57f0877d5a8a41",
        "5c0660a2b164910d8ff589c18e14552e9e0ec237dcefe2cb736d41a4811f81a0",
        "43bffa19d6ef651451f6841e019931e96f6f2eaeff28ab4b6f1ce4576de2717b",
        "63ecefee431d49523bc1136c4e72d0206a477086caf606cd5cf025686c109cf8",
        "ec4ffa1ad0ac88081314b7aaffef6a91f97cd57291bb5ba686c5415f5eb4f6b6",
        "92c063d67e8f14db71d288e11266ffdaf69cbf115f7bab14f3bc2f68d25e0e30"
      ];
      components[
        (
          cryptoProperties.assetType = 'certificate'
          or cryptoProperties.assetType = 'related-crypto-material'
        )
        and $exists(properties[name = 'cdx:crypto:spkiSha256'].value[$lowercase($) in $deny])
      ]
    )
  location: |
    {
      "bomRef": $firstNonEmpty($."bom-ref", bom.serialNumber)
    }
  message: "Certificate or key '{{ name }}' carries a public key Go 1.27.3/1.26.10 distrust (CVE-2026-111943)"
  mitigation: "Replace the certificate chain and remove the key from every trust store, bundle and pin. https://github.com/golang/go/commit/90617fb7ceb59cf08bee7826bb51b8c8fb8c11de"
  evidence: |
    {
      "spkiSha256": $prop($, 'cdx:crypto:spkiSha256'),
      "subject": cryptoProperties.certificateProperties.subjectName,
      "locations": $count(evidence.occurrences)
    }

- id: CBC-004
  name: "Certificate issued under a Go-distrusted key (CVE-2026-111943)"
  description: "The certificate was issued by one of the eight intermediate CA keys Go 1.27.3 and 1.26.10 distrust, so Go clients rebuilt with those releases will refuse the chain even while the operating system still accepts it."
  severity: high
  category: cbom-security
  dry-run-support: full
  standards:
    nist-800-53:
      - "SC-13 Cryptographic Protection"
  condition: |
    (
      $deny := [
        "ebed6475c2c2d80fcb199f3fe8dd6e6b3ce60b77eb15d4e42c3dec0c6f5b5105",
        "49dd353dc2b919a3770645117d0e60c16115e7d1bc259eefe734b00ea434fe5f",
        "e0254c7fcdc265e2f0f8a428dabb75ab4ae039b4872d62f5ee57f0877d5a8a41",
        "5c0660a2b164910d8ff589c18e14552e9e0ec237dcefe2cb736d41a4811f81a0",
        "43bffa19d6ef651451f6841e019931e96f6f2eaeff28ab4b6f1ce4576de2717b",
        "63ecefee431d49523bc1136c4e72d0206a477086caf606cd5cf025686c109cf8",
        "ec4ffa1ad0ac88081314b7aaffef6a91f97cd57291bb5ba686c5415f5eb4f6b6",
        "92c063d67e8f14db71d288e11266ffdaf69cbf115f7bab14f3bc2f68d25e0e30"
      ];
      $badSkis := components[
        cryptoProperties.assetType = 'certificate'
        and $exists(properties[name = 'cdx:crypto:spkiSha256'].value[$lowercase($) in $deny])
      ].properties[name = 'cdx:crypto:subjectKeyId'].value[$ != null].$lowercase($);
      components[
        cryptoProperties.assetType = 'certificate'
        and $not($exists(properties[name = 'cdx:crypto:spkiSha256'].value[$lowercase($) in $deny]))
        and (
          $count(properties[name = 'cdx:crypto:issuerSpkiSha256' or name = 'cdx:crypto:unverifiedIssuerSpkiSha256'].value[$lowercase($) in $deny]) > 0
          or (
            $prop($, 'cdx:crypto:authorityKeyId') != null
            and $lowercase($nullSafeProp($, 'cdx:crypto:authorityKeyId')) in $badSkis
          )
        )
      ]
    )
  location: |
    {
      "bomRef": $firstNonEmpty($."bom-ref", bom.serialNumber)
    }
  message: "Certificate '{{ name }}' was issued under a public key Go 1.27.3/1.26.10 distrust (CVE-2026-111943)"
  mitigation: "Re-issue the certificate under a trusted CA and update the server chain. https://github.com/golang/go/commit/90617fb7ceb59cf08bee7826bb51b8c8fb8c11de"
  evidence: |
    {
      "authorityKeyId": $prop($, 'cdx:crypto:authorityKeyId'),
      "issuerSpkiSha256": properties[name = 'cdx:crypto:issuerSpkiSha256'].value,
      "subject": cryptoProperties.certificateProperties.subjectName
    }

# Post-quantum OIDs (ML-DSA RFC 9881, SLH-DSA RFC 9909, ML-KEM RFC 9935) and
# the classical-only cutoff. NIST IR 8547 (final, October 2026) Tables 2 and 4
# disallow quantum-vulnerable signature and key-establishment algorithms after
# 2035.
- id: CBC-005
  name: "Classical-only CA certificate valid past the post-quantum transition"
  description: "A CA certificate whose key and signature algorithms are both classical stays valid beyond 2035-01-01, past the date after which NIST IR 8547 (final, October 2026, Tables 2 and 4) disallows quantum-vulnerable algorithms."
  severity: low
  category: cbom-security
  dry-run-support: full
  condition: |
    (
      $pq := [
        "2.16.840.1.101.3.4.3.17", "2.16.840.1.101.3.4.3.18", "2.16.840.1.101.3.4.3.19",
        "2.16.840.1.101.3.4.3.20", "2.16.840.1.101.3.4.3.21", "2.16.840.1.101.3.4.3.22",
        "2.16.840.1.101.3.4.3.23", "2.16.840.1.101.3.4.3.24", "2.16.840.1.101.3.4.3.25",
        "2.16.840.1.101.3.4.3.26", "2.16.840.1.101.3.4.3.27", "2.16.840.1.101.3.4.3.28",
        "2.16.840.1.101.3.4.3.29", "2.16.840.1.101.3.4.3.30", "2.16.840.1.101.3.4.3.31",
        "2.16.840.1.101.3.4.4.1", "2.16.840.1.101.3.4.4.2", "2.16.840.1.101.3.4.4.3"
      ];
      $cutoff := '2035-01-01T00:00:00Z';
      components[
        cryptoProperties.assetType = 'certificate'
        and $prop($, 'cdx:crypto:certRole') in ['root', 'intermediate']
        and $prop($, 'cdx:crypto:publicKeyAlgorithmOid') != null
        and $prop($, 'cdx:crypto:signatureAlgorithmOid') != null
        and $not($prop($, 'cdx:crypto:publicKeyAlgorithmOid') in $pq)
        and $not($prop($, 'cdx:crypto:signatureAlgorithmOid') in $pq)
        and $certEndMillis(cryptoProperties.certificateProperties.notValidAfter) != null
        and $certEndMillis(cryptoProperties.certificateProperties.notValidAfter) > $toMillis($cutoff)
      ]
    )
  location: |
    {
      "bomRef": $firstNonEmpty($."bom-ref", bom.serialNumber)
    }
  message: "CA certificate '{{ name }}' uses only classical algorithms but is valid past the 2035-01-01 cutoff"
  mitigation: "Plan a migration to post-quantum algorithms before the classical-only validity window ends."
  evidence: |
    {
      "keyAlgorithmOid": $prop($, 'cdx:crypto:publicKeyAlgorithmOid'),
      "signatureAlgorithmOid": $prop($, 'cdx:crypto:signatureAlgorithmOid'),
      "notValidAfter": cryptoProperties.certificateProperties.notValidAfter
    }

- id: CBC-006
  name: "Post-quantum key certified with a classical signature"
  description: "The certificate's public key is post-quantum but its signature algorithm is classical, so the authentication of that key is only as strong as the classical signature."
  severity: medium
  category: cbom-security
  dry-run-support: full
  condition: |
    (
      $pq := [
        "2.16.840.1.101.3.4.3.17", "2.16.840.1.101.3.4.3.18", "2.16.840.1.101.3.4.3.19",
        "2.16.840.1.101.3.4.3.20", "2.16.840.1.101.3.4.3.21", "2.16.840.1.101.3.4.3.22",
        "2.16.840.1.101.3.4.3.23", "2.16.840.1.101.3.4.3.24", "2.16.840.1.101.3.4.3.25",
        "2.16.840.1.101.3.4.3.26", "2.16.840.1.101.3.4.3.27", "2.16.840.1.101.3.4.3.28",
        "2.16.840.1.101.3.4.3.29", "2.16.840.1.101.3.4.3.30", "2.16.840.1.101.3.4.3.31",
        "2.16.840.1.101.3.4.4.1", "2.16.840.1.101.3.4.4.2", "2.16.840.1.101.3.4.4.3"
      ];
      components[
        cryptoProperties.assetType = 'certificate'
        and $prop($, 'cdx:crypto:publicKeyAlgorithmOid') in $pq
        and $prop($, 'cdx:crypto:signatureAlgorithmOid') != null
        and $not($prop($, 'cdx:crypto:signatureAlgorithmOid') in $pq)
      ]
    )
  location: |
    {
      "bomRef": $firstNonEmpty($."bom-ref", bom.serialNumber)
    }
  message: "Certificate '{{ name }}' binds a post-quantum key with the classical signature '{{ $prop($, 'cdx:crypto:signatureAlgorithm') }}'"
  mitigation: "Re-issue the certificate under a post-quantum or composite signature scheme once one is standardised for your chain."
  evidence: |
    {
      "keyAlgorithmOid": $prop($, 'cdx:crypto:publicKeyAlgorithmOid'),
      "signatureAlgorithmOid": $prop($, 'cdx:crypto:signatureAlgorithmOid')
    }

- id: CBC-007
  name: "Unrecognised certificate algorithm"
  description: "The key or signature algorithm is named only by its dotted OID, which means a composite, pre-standard or otherwise unregistered algorithm the inventory cannot classify. PLAN assigns this rule info severity; the rule engine's lowest level is low."
  severity: low
  category: cbom-security
  dry-run-support: full
  condition: |
    components[
      (
        cryptoProperties.assetType = 'certificate'
        and $match($safeStr($prop($, 'cdx:crypto:signatureAlgorithm')), /^[0-9]+(\.[0-9]+)+$/)
      )
      or (
        cryptoProperties.assetType = 'related-crypto-material'
        and $match(name, /^[0-9]+(\.[0-9]+)+$/)
      )
    ]
  location: |
    {
      "bomRef": $firstNonEmpty($."bom-ref", bom.serialNumber)
    }
  message: "Certificate '{{ name }}' uses an algorithm named only by its OID '{{ $firstNonEmpty($prop($, 'cdx:crypto:signatureAlgorithm'), name) }}'"
  mitigation: "Identify the algorithm behind the OID and confirm it is an approved one for this use."
  evidence: |
    {
      "signatureAlgorithm": $prop($, 'cdx:crypto:signatureAlgorithm'),
      "signatureAlgorithmOid": $prop($, 'cdx:crypto:signatureAlgorithmOid'),
      "name": name
    }
